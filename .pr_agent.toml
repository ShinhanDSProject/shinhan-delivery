[config]
model = "google/gemini-1.5-flash"
fallback_models = ["google/gemini-1.5-pro"]
git_provider = "github"

[github_action_config]
auto_review = true
auto_describe = true
auto_improve = true
override_events = ["opened", "reopened", "synchronize"]

[pr_reviewer]
require_canvas_review = false
require_security_review = true
require_tests_review = true
persistent_comment = true
extra_instructions = """
- 모든 리뷰 의견 및 요약은 반드시 친절하고 다정한 한국어(ko-KR)로 작성해 주세요.
- 주요 대상자는 소프트웨어 개발을 처음 배우는 교육생(초급자)입니다.
- 단순 지적에 그치지 않고, 왜 그렇게 수정해야 하는지 핵심 원리를 다정하게 설명해 주세요.
- 의존성 방향 단방향(Controller -> Service -> Repository), Lombok @Getter/@Setter 100% 사용, System.out.println 금지를 검증해 주세요.
- 신규 기능/아키텍처 도입 시 docs/ 또는 code-convention.md 동기화 보완을 권고해 주세요.
"""
