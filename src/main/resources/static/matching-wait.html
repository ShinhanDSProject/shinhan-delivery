<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매칭 대기 - 신한 개척자</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <script src="/js/utils/storage.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family-base); }
        body { min-height: 100vh; background: #f8fafc; color: var(--color-black-200); }
        .page { max-width: 480px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; padding: 24px; text-align: center; }
        .orb { width: 120px; height: 120px; margin: 0 auto 28px; border-radius: 999px; background: radial-gradient(circle at 35% 35%, #8ebcff, #2c88ff); position: relative; box-shadow: 0 25px 40px rgba(44, 136, 255, 0.2); }
        .orb::after { content: ""; position: absolute; inset: 18px; border-radius: 999px; border: 2px dashed rgba(255, 255, 255, 0.8); animation: spin 8s linear infinite; }
        h1 { font-size: 28px; font-weight: 800; }
        p { margin-top: 12px; color: var(--color-grey-300); line-height: 1.7; font-size: 14px; }
        .route { margin-top: 24px; padding: 18px; border-radius: 20px; background: #fff; border: 1px solid var(--color-grey-50); box-shadow: var(--shadow-sm); text-align: left; }
        .route strong { display: block; font-size: 15px; margin-bottom: 8px; }
        .loading-dots { margin-top: 26px; display: flex; justify-content: center; gap: 8px; }
        .loading-dots span { width: 10px; height: 10px; border-radius: 999px; background: var(--color-blue-100); animation: bounce 1.1s infinite ease-in-out; }
        .loading-dots span:nth-child(2) { animation-delay: .15s; }
        .loading-dots span:nth-child(3) { animation-delay: .3s; }
        .cta { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
        .btn { height: 56px; border-radius: 16px; border: 0; font-size: 16px; font-weight: 800; cursor: pointer; }
        .btn-primary { background: var(--color-blue-500); color: #fff; }
        .btn-secondary { background: transparent; color: var(--color-grey-300); border: 1px solid var(--color-grey-50); }
        @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.45; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
<main class="page">
    <div class="orb"></div>
    <h1>배송자를 찾고 있습니다</h1>
    <p>결제가 완료되어 매칭 요청이 접수되었습니다. 조건에 맞는 배송자를 탐색하는 동안 잠시만 기다려 주세요.</p>

    <section class="route">
        <strong id="routeSummary">출발지 → 도착지</strong>
        <div id="feeSummary">결제 금액 0 P</div>
    </section>

    <div class="loading-dots"><span></span><span></span><span></span></div>

    <div class="cta">
        <button type="button" class="btn btn-primary" onclick="location.href='/home.html'">홈에서 상태 확인</button>
        <button type="button" class="btn btn-secondary" onclick="location.href='/notifications.html'">알림 센터 보기</button>
    </div>
</main>

<script>
    function formatPoint(value) {
        return `${Number(value || 0).toLocaleString()} P`;
    }

    (function init() {
        const draft = loadDraft();
        const pickup = draft.pickup && draft.pickup.address ? draft.pickup.address : '출발지 미입력';
        const dropoff = draft.dropoff && draft.dropoff.address ? draft.dropoff.address : '도착지 미입력';
        document.getElementById('routeSummary').textContent = `${pickup} → ${dropoff}`;
        document.getElementById('feeSummary').textContent =
            `결제 금액 ${formatPoint(draft.paymentEstimate && draft.paymentEstimate.totalFee)}`;
    })();
</script>
</body>
</html>
