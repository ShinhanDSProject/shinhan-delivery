<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>역할 선택 - 신한 배달 (Deliver Happiness)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/design-system.css">
    <style>
        :root {
            --primary: var(--color-blue-100);
            --primary-hover: var(--color-blue-500);
            --primary-light: var(--color-blue-50);
            --text-dark: var(--color-black-200);
            --text-muted: var(--color-grey-300);
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: var(--color-grey-50);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 520px;
            padding: 44px 36px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .header {
            margin-bottom: 32px;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .role-card {
            position: relative;
            border: 2px solid var(--border-color);
            border-radius: 18px;
            padding: 28px 20px;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .role-card:hover {
            transform: translateY(-4px);
            border-color: #94a3b8;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        .role-card.active {
            border-color: var(--primary);
            background: #f0f5ff;
            box-shadow: 0 10px 25px rgba(0, 70, 255, 0.15);
        }

        .role-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            transition: background 0.3s;
        }

        .role-card.active .role-icon {
            background: var(--primary);
            color: #ffffff;
        }

        .role-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .role-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .check-mark {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary);
            color: #ffffff;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .role-card.active .check-mark {
            display: flex;
        }

        .member-id-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 24px;
            outline: none;
            transition: border-color 0.2s;
        }

        .member-id-input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 8px 20px rgba(0, 70, 255, 0.25);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .toast {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .toast.success {
            background: #dcfce7;
            color: #15803d;
        }

        .toast.error {
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">STEP 02</span>
            <h1>서비스 이용 역할 선택</h1>
            <p class="subtitle">개인고객 또는 배송파트너 중 원하는 서비스를 선택하세요.<br>선택한 역할은 언제든지 변경 가능합니다.</p>
        </div>

        <input type="number" id="memberIdInput" class="member-id-input" placeholder="회원 ID를 입력하세요 (예: 1)" value="1">

        <div class="role-grid">
            <div class="role-card active" id="cardCustomer" onclick="selectRole('CUSTOMER')">
                <div class="check-mark">✓</div>
                <div class="role-icon">📦</div>
                <div class="role-title">개인고객</div>
                <div class="role-desc">물품을 간편하게 보내고 실시간 추적하세요</div>
            </div>

            <div class="role-card" id="cardCourier" onclick="selectRole('COURIER')">
                <div class="check-mark">✓</div>
                <div class="role-icon">🛵</div>
                <div class="role-title">배송파트너</div>
                <div class="role-desc">배송 건을 수행하고 수익을 창출하세요</div>
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="submitRoleUpdate()">역할 설정 완료</button>

        <div id="toast" class="toast"></div>
    </div>

    <script>
        let selectedRole = 'CUSTOMER';

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('cardCustomer').classList.toggle('active', role === 'CUSTOMER');
            document.getElementById('cardCourier').classList.toggle('active', role === 'COURIER');
        }

        async function submitRoleUpdate() {
            const memberId = document.getElementById('memberIdInput').value;
            const toast = document.getElementById('toast');
            toast.style.display = 'none';

            if (!memberId) {
                showToast('회원 ID를 입력해 주세요.', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/v1/members/${memberId}/role`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: selectedRole })
                });

                if (response.ok) {
                    const data = await response.json();
                    showToast(`역할이 [${data.role}] (으)로 성공적으로 변경되었습니다!`, 'success');
                } else {
                    const error = await response.json().catch(() => ({}));
                    showToast(`역할 변경 실패: ${error.message || response.statusText}`, 'error');
                }
            } catch (err) {
                showToast('서버 통신 오류가 발생했습니다.', 'error');
            }
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
        }
    </script>
</body>
</html>
