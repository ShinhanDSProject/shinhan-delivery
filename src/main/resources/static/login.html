<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 로그인 - 신한 개척자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #4a85ee; --text: #202532; --muted: #8998b1; --field: #f7f7f8; }
        * { box-sizing: border-box; margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { min-height: 100vh; background: #f5f6f8; color: var(--text); }
        .page { position: relative; display: flex; flex-direction: column; width: 100%; min-height: 100vh; max-width: 680px; margin: 0 auto; padding: 100px 40px 72px; background: #fbfcff; }
        .back-button { position: absolute; top: 97px; left: 40px; width: 40px; height: 40px; padding: 0; border: 0; background: transparent; color: var(--text); cursor: pointer; }
        .back-button::before { content: ''; display: inline-block; width: 12px; height: 12px; border-left: 3px solid currentColor; border-bottom: 3px solid currentColor; transform: rotate(45deg); }
        h1 { font-size: 30px; line-height: 40px; font-weight: 700; text-align: center; letter-spacing: -1.1px; }
        form { margin-top: 88px; }
        .field { margin-bottom: 38px; }
        label { display: block; margin-bottom: 14px; color: #515d70; font-size: 20px; font-weight: 700; letter-spacing: -0.6px; }
        input { width: 100%; height: 84px; padding: 0 26px; border: 2px solid transparent; border-radius: 20px; outline: none; background: var(--field); color: var(--text); font-size: 22px; letter-spacing: -0.6px; transition: border-color .15s, background .15s; }
        input::placeholder { color: #98a7bf; }
        input:focus { border-color: var(--blue); background: #fff; }
        .message { display: none; margin-top: -20px; margin-bottom: 18px; color: #d64040; font-size: 15px; font-weight: 500; }
        .message.show { display: block; }
        .message.success { color: #25824d; }
        .bottom { margin-top: auto; padding-top: 64px; }
        .login-button { width: 100%; height: 97px; border: 0; border-radius: 25px; background: var(--blue); color: #fff; cursor: pointer; font-size: 30px; font-weight: 700; letter-spacing: -1px; transition: background .15s, transform .15s; }
        .login-button:hover { background: #3676e6; }
        .login-button:active { transform: scale(.99); }
        .login-button:disabled { background: #a9c4f6; cursor: wait; }
        .links { display: flex; justify-content: center; align-items: center; gap: 24px; margin-top: 35px; font-size: 19px; font-weight: 600; letter-spacing: -0.6px; }
        .links a { color: var(--blue); text-decoration: none; }
        .links span { width: 1px; height: 21px; background: #d9dfe8; }
        .links .signup-link { color: #59616e; }
        @media (max-width: 520px) { .page { padding: 96px 28px 52px; } .back-button { top: 93px; left: 28px; } h1 { font-size: 28px; } form { margin-top: 82px; } label { font-size: 19px; } input { height: 82px; font-size: 21px; } .login-button { height: 96px; font-size: 29px; } }
    </style>
</head>
<body>
<main class="page">
    <button class="back-button" type="button" aria-label="이전 페이지" onclick="history.back()"></button>
    <h1>이메일 로그인</h1>

    <form id="loginForm" novalidate>
        <div class="field">
            <label for="email">이메일 주소</label>
            <input id="email" name="email" type="email" placeholder="example@lumen.com" autocomplete="email" required>
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요" autocomplete="current-password" required>
        </div>
        <p id="message" class="message" role="alert" aria-live="polite"></p>
    </form>

    <div class="bottom">
        <button id="loginButton" class="login-button" type="submit" form="loginForm">로그인</button>
        <nav class="links" aria-label="계정 관련 링크">
            <a href="#" id="forgotPassword">비밀번호를 잊으셨나요?</a>
            <span aria-hidden="true"></span>
            <a class="signup-link" href="/signup.html">회원가입</a>
        </nav>
    </div>
</main>

<script>
    const loginForm = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const message = document.getElementById('message');

    function showMessage(text, isSuccess = false) {
        message.textContent = text;
        message.className = isSuccess ? 'message show success' : 'message show';
    }

    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.classList.remove('show');

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) {
            showMessage('이메일 주소와 비밀번호를 모두 입력해주세요.');
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = '로그인 중...';
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            if (!response.ok) {
                showMessage(data.message || '이메일 또는 비밀번호가 올바르지 않습니다.');
                return;
            }

            localStorage.setItem('accessToken', data.accessToken);
            localStorage.setItem('tokenType', data.tokenType || 'Bearer');
            showMessage('로그인에 성공했습니다.', true);
        } catch (error) {
            showMessage('서버 통신 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = '로그인';
        }
    });

    document.getElementById('forgotPassword').addEventListener('click', (event) => {
        event.preventDefault();
        showMessage('비밀번호 찾기 기능은 아직 준비 중입니다.');
    });
</script>
</body>
</html>
