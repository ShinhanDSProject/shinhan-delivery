<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 완료 - 신한 개척자</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <script src="/js/utils/storage.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family-base); }
        body { min-height: 100vh; background: radial-gradient(circle at top, #eff6ff 0%, #ffffff 55%); color: var(--color-black-200); }
        .page { max-width: 480px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; padding: 24px 20px; }
        .status-card { margin-top: 40px; background: #fff; border: 1px solid var(--color-blue-50); border-radius: 28px; box-shadow: var(--shadow-lg); padding: 30px 24px; text-align: center; }
        .checkmark { width: 84px; height: 84px; border-radius: 999px; margin: 0 auto 18px; background: linear-gradient(135deg, var(--color-blue-100), var(--color-blue-500)); display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 20px 40px rgba(44, 136, 255, 0.25); }
        .status-card h1 { font-size: 28px; font-weight: 800; }
        .status-card p { margin-top: 10px; color: var(--color-grey-300); line-height: 1.6; font-size: 14px; }
        .detail-card { margin-top: 18px; background: #fff; border-radius: 22px; padding: 20px; border: 1px solid var(--color-grey-50); box-shadow: var(--shadow-sm); }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 14px; }
        .row + .row { border-top: 1px solid var(--color-grey-30); }
        .row strong { font-size: 15px; }
        .cta { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 20px; }
        .primary-btn, .secondary-btn { height: 56px; border-radius: 16px; border: 0; font-size: 16px; font-weight: 800; cursor: pointer; }
        .primary-btn { background: var(--color-blue-500); color: #fff; box-shadow: var(--shadow-lg); }
        .secondary-btn { background: transparent; color: var(--color-grey-300); border: 1px solid var(--color-grey-50); }
    </style>
</head>
<body>
<main class="page">
    <section class="status-card">
        <div class="checkmark">
            <svg viewBox="0 0 24 24" fill="none" width="40" height="40"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1>결제가 완료되었습니다</h1>
        <p>배송 요청이 정상적으로 접수되었습니다. 이제 배송자 매칭 단계로 넘어가며 진행 상태는 다음 화면에서 확인할 수 있습니다.</p>
    </section>

    <section class="detail-card">
        <div class="row"><span>결제 금액</span><strong id="paidAmount">0 P</strong></div>
        <div class="row"><span>결제 후 잔액</span><strong id="remainingBalance">0 P</strong></div>
        <div class="row"><span>결제 상태</span><strong>완료</strong></div>
        <div class="row"><span>매칭 상태</span><strong id="matchingStatus">MATCHING</strong></div>
    </section>

    <div class="cta">
        <button type="button" class="primary-btn" onclick="location.href='/matching-wait.html'">매칭 대기 화면으로 이동</button>
        <button type="button" class="secondary-btn" onclick="location.href='/home.html'">홈으로 돌아가기</button>
    </div>
</main>

<script>
    function formatPoint(value) {
        return `${Number(value || 0).toLocaleString()} P`;
    }

    (function init() {
        const draft = loadDraft();
        if (!draft.paymentResult || !draft.paymentEstimate) {
            location.replace('/payment-confirmation.html');
            return;
        }

        const remainingBalance =
            draft.paymentResult.remainingBalance ??
            Math.max(
                0,
                Number(draft.paymentEstimate.walletBalance || 0)
                    - Number(draft.paymentEstimate.totalFee || 0));

        document.getElementById('paidAmount').textContent =
            formatPoint(draft.paymentResult.paidAmount || draft.paymentEstimate.totalFee);
        document.getElementById('remainingBalance').textContent = formatPoint(remainingBalance);
        document.getElementById('matchingStatus').textContent = draft.paymentResult.matchedStatus || 'MATCHING';
    })();
</script>
</body>
</html>
