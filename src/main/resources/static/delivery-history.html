<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송 내역 - 신한 개척자</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <style>
        :root {
            --text-dark: var(--color-black-200);
            --text-muted: var(--color-grey-300);
            --text-faint: var(--color-grey-100);
            --border: var(--color-grey-50);
            --primary: var(--color-blue-30);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family-base);
        }

        body {
            min-height: 100vh;
            color: var(--text-dark);
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #FAFBFD;
            padding-bottom: 96px;
        }

        header.top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
        }

        .back-button {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            border: 0;
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header.top h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            gap: 8px;
            padding: 0 20px 16px;
            overflow-x: auto;
        }

        .tabs button {
            flex: none;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .tabs button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #000;
        }

        .history-list {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .history-card {
            display: block;
            width: 100%;
            text-align: left;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            color: inherit;
            text-decoration: none;
        }

        .card-top, .card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-top .date {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-faint);
        }

        .status-badge {
            display: inline-flex;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-badge.in-progress { background: var(--color-blue-50); color: var(--color-blue-30); }
        .status-badge.completed { background: var(--color-green-50); color: var(--color-green-200); }
        .status-badge.cancelled { background: var(--color-grey-30); color: var(--text-faint); }

        .card-mid {
            margin: 12px 0;
        }

        .card-mid .route {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .card-bottom .fee {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary);
        }

        .card-bottom .chevron {
            color: var(--text-faint);
        }

        .empty-state, .loading-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        nav.bottom-tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 16px 32px calc(16px + env(safe-area-inset-bottom));
        }

        nav.bottom-tab-bar button,
        nav.bottom-tab-bar a {
            border: 0;
            background: transparent;
            color: var(--text-faint);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px 6px;
            text-decoration: none;
            cursor: pointer;
        }

        nav.bottom-tab-bar svg {
            width: 30px;
            height: 30px;
        }

        nav.bottom-tab-bar .point-icon {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }

        nav.bottom-tab-bar .active {
            color: var(--primary);
        }
    </style>
</head>
<body>
<main class="page">
    <header class="top">
        <button class="back-button" type="button" aria-label="이전으로" onclick="location.href='/home.html'">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1>배송 내역</h1>
    </header>

    <nav class="tabs" id="tabs">
        <button type="button" class="active" data-tab="ALL">전체</button>
        <button type="button" data-tab="IN_PROGRESS">진행중</button>
        <button type="button" data-tab="COMPLETED">완료</button>
        <button type="button" data-tab="CANCELLED">취소</button>
    </nav>

    <div class="history-list" id="list"></div>
</main>

<nav class="bottom-tab-bar" aria-label="하단 메뉴">
    <a href="/my-page.html" aria-label="포인트"><span class="point-icon" aria-hidden="true">P</span></a>
    <a href="/home.html" aria-label="홈">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 11 12 4l8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a href="/my-page.html" class="active" aria-label="마이페이지" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </a>
</nav>

<script>
    const PAGE_SIZE = 10;
    const IN_PROGRESS_STATUSES = ['REQUESTED', 'MATCHED', 'PICKED_UP'];

    let currentTab = 'ALL';
    let currentPage = 0;
    let isLastPage = false;
    let isLoading = false;
    // 탭을 빠르게 전환하면 이전 탭의 느린 응답이 나중에 도착해 새 탭 화면을 덮어쓸 수 있어, 요청마다 세대를
    // 매겨서 그 사이 탭이 바뀌었으면(=세대가 달라졌으면) 응답을 버린다.
    let requestGeneration = 0;

    function authHeader() {
        const token = localStorage.getItem('accessToken');
        const tokenType = localStorage.getItem('tokenType') || 'Bearer';
        if (!token) return null;
        return `${tokenType} ${token}`;
    }

    function formatDate(isoString) {
        const date = new Date(isoString);
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}.${mm}.${dd}`;
    }

    function badgeFor(status) {
        if (status === 'COMPLETED') return { className: 'completed', label: '완료' };
        if (status === 'CANCELLED') return { className: 'cancelled', label: '취소' };
        return { className: 'in-progress', label: '진행중' };
    }

    /** status 쿼리 파라미터를 붙여 한 페이지를 조회한다. IN_PROGRESS/ALL 탭은 서버가 지원하는 단일 status 필터로 못 표현해 status 없이 조회한다. */
    async function fetchPage(tab, page) {
        const header = authHeader();
        if (!header) return null;
        const statusParam = tab === 'COMPLETED' || tab === 'CANCELLED' ? `&status=${tab}` : '';
        const response = await fetch(`/api/v1/delivery-requests?page=${page}&size=${PAGE_SIZE}${statusParam}`, {
            headers: { Authorization: header }
        });
        if (response.status === 401 || response.status === 403) {
            location.replace('/login.html');
            return null;
        }
        if (!response.ok) return null;
        return response.json();
    }

    function renderCard(item) {
        const badge = badgeFor(item.status);
        const card = document.createElement('a');
        card.className = 'history-card';
        card.href = (item.status === 'CANCELLED' ? '/cancel-detail.html?id=' : '/delivery-detail.html?id=')
            + encodeURIComponent(item.id);
        card.innerHTML = `
            <div class="card-top">
                <span class="date">${formatDate(item.createdAt)}</span>
                <span class="status-badge ${badge.className}">${badge.label}</span>
            </div>
            <div class="card-mid">
                <div class="route" data-field="route"></div>
            </div>
            <div class="card-bottom">
                <span class="fee">${item.feePoint.toLocaleString()} P</span>
                <span class="chevron" aria-hidden="true">›</span>
            </div>
        `;
        // pickupAddress/dropoffAddress는 고객이 자유 입력하는 텍스트라 innerHTML에 직접 꽂지 않고
        // textContent로만 채워 스크립트 삽입(XSS)을 막는다.
        card.querySelector('[data-field="route"]').textContent = `${item.pickupAddress} → ${item.dropoffAddress}`;
        return card;
    }

    async function loadNextPage() {
        if (isLoading || isLastPage) return;
        isLoading = true;
        const generation = requestGeneration;
        const tab = currentTab;
        const page = currentPage;

        const list = document.getElementById('list');
        if (page === 0) {
            list.innerHTML = '<div class="loading-state">불러오는 중...</div>';
        }

        try {
            const response = await fetchPage(tab, page);

            if (generation !== requestGeneration) {
                // 응답이 오는 사이 다른 탭으로 전환됨 — 오래된 응답이라 화면에 반영하지 않고 버린다.
                return;
            }
            if (!response) return;

            let items = response.content || [];
            if (tab === 'IN_PROGRESS') {
                items = items.filter((item) => IN_PROGRESS_STATUSES.includes(item.status));
            }

            if (page === 0) {
                list.innerHTML = '';
            }

            if (page === 0 && items.length === 0 && response.last) {
                list.innerHTML = '<div class="empty-state">표시할 배송 내역이 없어요.</div>';
            } else {
                items.forEach((item) => list.appendChild(renderCard(item)));
            }

            isLastPage = response.last;
            currentPage += 1;
        } catch (error) {
            if (generation === requestGeneration && page === 0) {
                list.innerHTML = '<div class="empty-state">배송 내역을 불러오지 못했어요.</div>';
            }
        } finally {
            if (generation === requestGeneration) {
                isLoading = false;
            }
        }
    }

    function resetAndLoad(tab) {
        requestGeneration += 1;
        currentTab = tab;
        currentPage = 0;
        isLastPage = false;
        isLoading = false;
        loadNextPage();
    }

    document.getElementById('tabs').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-tab]');
        if (!button) return;
        document.querySelectorAll('#tabs button').forEach((b) => b.classList.remove('active'));
        button.classList.add('active');
        resetAndLoad(button.dataset.tab);
    });

    window.addEventListener('scroll', () => {
        const scrolledToBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 200;
        if (scrolledToBottom) loadNextPage();
    });

    if (!authHeader()) {
        location.replace('/login.html');
    } else {
        loadNextPage();
    }
</script>
</body>
</html>
