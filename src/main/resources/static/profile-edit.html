<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 수정 - 신한 개척자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/my-page.css">
</head>
<body class="mypage-body">
<main class="mobile-shell">
  <header class="page-header">
    <button class="icon-button" type="button" aria-label="마이페이지로 돌아가기" onclick="location.href='/my-page.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="page-title">프로필 수정</h1>
    <span aria-hidden="true"></span>
  </header>

  <div class="avatar-editor" aria-label="기본 프로필 이미지">
    <div class="avatar avatar--large" aria-hidden="true"></div>
    <span class="avatar-camera" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M4 8.5h3l1.5-2h7l1.5 2h3v10H4v-10Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="12" cy="13.5" r="3" stroke="currentColor" stroke-width="2"/>
      </svg>
    </span>
  </div>

  <form id="profileForm" novalidate>
    <div class="field-group">
      <label class="field-label" for="name">이름</label>
      <input class="field-input" id="name" name="name" autocomplete="name" maxlength="50" required>
      <p id="nameHint" class="field-hint">2자 이상 50자 이하로 입력해주세요.</p>
    </div>
    <div class="field-group">
      <label class="field-label" for="email">이메일</label>
      <input class="field-input" id="email" name="email" type="email" readonly aria-readonly="true">
      <p class="field-hint">이메일은 변경할 수 없습니다.</p>
    </div>
    <div class="field-group">
      <label class="field-label" for="phoneNumber">휴대폰 번호</label>
      <input class="field-input" id="phoneNumber" name="phoneNumber" type="tel" inputmode="tel" placeholder="010-1234-5678" autocomplete="tel" required>
      <p id="phoneHint" class="field-hint">하이픈(-)을 포함해 입력해주세요.</p>
    </div>

    <button id="saveButton" class="primary-action" type="submit">저장하기</button>
    <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
  </form>

  <nav class="bottom-nav" aria-label="하단 내비게이션">
    <a class="bottom-nav__item is-active" href="/my-page.html" aria-label="마이페이지"><span class="brand-p">P</span></a>
    <span class="bottom-nav__item is-disabled" aria-label="홈 준비 중" aria-disabled="true">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5v-9Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 21v-7h6v7" stroke="currentColor" stroke-width="1.7"/>
      </svg>
    </span>
    <a class="bottom-nav__item" href="/my-page.html" aria-label="전체 메뉴">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </a>
  </nav>
</main>

<script src="/js/my-page-api.js"></script>
<script>
  const form = document.getElementById("profileForm");
  const nameInput = document.getElementById("name");
  const emailInput = document.getElementById("email");
  const phoneInput = document.getElementById("phoneNumber");
  const saveButton = document.getElementById("saveButton");
  const statusMessage = document.getElementById("statusMessage");
  const phonePattern = /^\d{2,3}-\d{3,4}-\d{4}$/;

  function showStatus(message, type = "") {
    statusMessage.textContent = message;
    statusMessage.className = `status-message${type ? ` is-${type}` : ""}`;
  }

  function validateForm() {
    const name = nameInput.value.trim();
    const phoneNumber = phoneInput.value.trim();
    document.getElementById("nameHint").classList.remove("is-error");
    document.getElementById("phoneHint").classList.remove("is-error");

    if (name.length < 2 || name.length > 50) {
      document.getElementById("nameHint").classList.add("is-error");
      nameInput.focus();
      return false;
    }
    if (!phonePattern.test(phoneNumber)) {
      document.getElementById("phoneHint").classList.add("is-error");
      phoneInput.focus();
      return false;
    }
    return true;
  }

  async function loadProfile() {
    showStatus("프로필을 불러오는 중입니다.");
    try {
      const profile = await MyPageApi.request("/api/v1/members/me");
      nameInput.value = profile.name;
      emailInput.value = profile.email;
      phoneInput.value = profile.phoneNumber;
      showStatus("");
    } catch (error) {
      showStatus(error.message, "error");
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!validateForm()) {
      showStatus("입력 내용을 다시 확인해주세요.", "error");
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "저장 중...";
    showStatus("");
    try {
      const profile = await MyPageApi.request("/api/v1/members/me", {
        method: "PATCH",
        body: JSON.stringify({
          name: nameInput.value.trim(),
          phoneNumber: phoneInput.value.trim()
        })
      });
      nameInput.value = profile.name;
      phoneInput.value = profile.phoneNumber;
      showStatus("프로필이 저장되었습니다.", "success");
    } catch (error) {
      showStatus(error.message, "error");
    } finally {
      saveButton.disabled = false;
      saveButton.textContent = "저장하기";
    }
  });

  if (MyPageApi.requireToken()) loadProfile();
</script>
</body>
</html>
