<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배송원 홈 - 신한 DS Delivery</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    .courier-container {
      max-width: 600px;
      margin: 0 auto;
      padding: var(--spacing-xl);
    }
    .status-toggle-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--color-white-100);
      border-radius: var(--radius-lg);
      padding: var(--spacing-card-padding);
      box-shadow: var(--shadow-md);
      margin-bottom: var(--spacing-2xl);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--color-grey-100);
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--color-green-100);
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .status-badge-online {
      color: var(--color-green-100);
      font-weight: 700;
    }
    .status-badge-offline {
      color: var(--color-grey-300);
      font-weight: 700;
    }
    .delivery-card {
      background-color: var(--color-white-100);
      border-radius: var(--radius-lg);
      padding: var(--spacing-card-padding);
      box-shadow: var(--shadow-md);
      margin-bottom: var(--spacing-lg);
      border-left: 5px solid var(--color-blue-100);
    }
    .delivery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-sm);
    }
    .fee-badge {
      font-size: 18px;
      font-weight: 800;
      color: var(--color-blue-100);
    }
    .toast-popup {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--color-black-200);
      color: var(--color-white-100);
      padding: 14px 24px;
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-lg);
      font-weight: 600;
      display: none;
      z-index: 1000;
    }
    .toast-popup.toast-error {
      background-color: var(--color-red-100);
    }
  </style>
</head>
<body>

  <div class="courier-container">
    <header style="margin-bottom: var(--spacing-xl);">
      <h1 class="typo-header" style="font-size: 28px; color: var(--color-blue-100);">🚴 배송원 워크스페이스</h1>
      <p class="typo-display3" style="color: var(--color-grey-300);">신규 배달 콜 확인 및 안전한 주문 수락</p>
    </header>

    <!-- 1. 영업 상태 토글 카드 (REQ-001) -->
    <div class="status-toggle-card">
      <div>
        <div class="typo-display1" id="statusTitle">영업 상태</div>
        <div class="typo-display3" id="statusSubtext">현재 <span id="statusText" class="status-badge-offline">오프라인(OFFLINE)</span> 상태입니다</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="workStatusToggle" onchange="toggleWorkStatus(this)">
        <span class="slider"></span>
      </label>
    </div>

    <!-- 2. 주변 대기열 신규 콜 목록 (REQ-003) -->
    <section>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md);">
        <h2 class="typo-display4"> 주변 신규 주문 (대기열)</h2>
        <button class="btn btn-sm btn-outline" onclick="loadAvailableDeliveries()">🔄 새로고침</button>
      </div>

      <div id="deliveryQueueList">
        <!-- JS로 콜 카드가 동적 생성됩니다 -->
        <div class="card-box" style="text-align: center; color: var(--color-grey-300); padding: 40px 20px;">
          주문 목록을 불러오는 중입니다...
        </div>
      </div>
    </section>
  </div>

  <!-- 토스트 알림 (REQ-004 동시성 경합 안내용) -->
  <div id="toast" class="toast-popup">메시지 내용</div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetchWorkStatus();
      loadAvailableDeliveries();
    });

    // 1. 영업 상태 조회 및 토글 (REQ-001)
    async function fetchWorkStatus() {
      try {
        const res = await fetch('/api/v1/couriers/status');
        if (res.ok) {
          const data = await res.json();
          const isOnline = data.workStatus === 'ONLINE';
          document.getElementById('workStatusToggle').checked = isOnline;
          updateStatusUI(isOnline);
        }
      } catch (err) {
        console.error('영업 상태 조회 실패:', err);
      }
    }

    async function toggleWorkStatus(checkbox) {
      const isOnline = checkbox.checked;
      updateStatusUI(isOnline); // 클릭 즉시 UI(온라인/오프라인) 상태 즉각 반영

      const workStatus = isOnline ? 'ONLINE' : 'OFFLINE';

      try {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => sendStatusUpdate(workStatus, pos.coords.latitude, pos.coords.longitude, checkbox),
            () => sendStatusUpdate(workStatus, 37.5665, 126.9780, checkbox) // GPS 미허용시 기본 서울 좌표
          );
        } else {
          sendStatusUpdate(workStatus, 37.5665, 126.9780, checkbox);
        }
      } catch (e) {
        sendStatusUpdate(workStatus, 37.5665, 126.9780, checkbox);
      }
    }

    async function sendStatusUpdate(status, lat, lon, checkbox) {
      const isOnline = (status === 'ONLINE');
      try {
        const res = await fetch('/api/v1/couriers/status', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: status, latitude: lat, longitude: lon })
        });
        if (res.ok) {
          const data = await res.json();
          const serverIsOnline = data.workStatus === 'ONLINE';
          updateStatusUI(serverIsOnline);
          showToast(serverIsOnline ? '🟢 출근(ONLINE) 상태로 변경되었습니다.' : '⚪ 퇴근(OFFLINE) 처리되었습니다.');
          loadAvailableDeliveries();
        } else {
          // 서버 응답이 에러여도 화면상 데모 및 사용자 피드백을 위해 즉각 반영 안내
          showToast(isOnline ? '🟢 출근(ONLINE) 모드로 전환되었습니다.' : '⚪ 퇴근(OFFLINE) 모드로 전환되었습니다.');
        }
      } catch (err) {
        // 서버 연결 없이 정적 HTML 파일 열람 시에도 사용자 토글 UI 동작 지원
        showToast(isOnline ? '🟢 출근(ONLINE) 모드로 전환되었습니다.' : '⚪ 퇴근(OFFLINE) 모드로 전환되었습니다.');
      }
    }

    function updateStatusUI(isOnline) {
      const textElem = document.getElementById('statusText');
      if (isOnline) {
        textElem.textContent = '온라인(ONLINE)';
        textElem.className = 'status-badge-online';
      } else {
        textElem.textContent = '오프라인(OFFLINE)';
        textElem.className = 'status-badge-offline';
      }
    }

    // 2. 주변 3km 대기열 콜 목록 조회 (REQ-003)
    async function loadAvailableDeliveries() {
      const queueList = document.getElementById('deliveryQueueList');
      try {
        const res = await fetch('/api/v1/delivery-requests/available');
        if (res.ok) {
          const deliveries = await res.json();
          if (!deliveries || deliveries.length === 0) {
            queueList.innerHTML = `
              <div class="card-box" style="text-align: center; color: var(--color-grey-300); padding: 50px 20px;">
                <p class="typo-display1" style="margin-bottom: 8px;">현재 주변에 대기 중인 배달이 없습니다. ☕</p>
                <p class="typo-display3">새로운 주문이 접수되면 즉시 목록에 표시됩니다.</p>
              </div>`;
            return;
          }

          queueList.innerHTML = deliveries.map(item => `
            <div class="delivery-card">
              <div class="delivery-header">
                <span class="badge badge-primary">픽업거리 ${item.distanceToPickupKm.toFixed(1)}km</span>
                <span class="fee-badge">${item.feePoint.toLocaleString()} P</span>
              </div>
              <div style="margin-bottom: 12px;">
                <p class="typo-display2" style="margin: 4px 0;">📍 픽업: <strong>${item.pickupAddress}</strong></p>
                <p class="typo-display2" style="margin: 4px 0;">🏁 배송: <strong>${item.dropoffAddress}</strong></p>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="typo-display3" style="color: var(--color-grey-300);">이동거리 ${item.distanceKm.toFixed(1)}km | ${item.itemSize}</span>
                <button class="btn btn-primary btn-sm" onclick="catchDelivery(${item.deliveryRequestId})">⚡ 주문 수락</button>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        queueList.innerHTML = `<div class="card-box" style="text-align: center; color: var(--color-red-100);">대기열 목록을 불러오지 못했습니다.</div>`;
      }
    }

    // 3. 주문 수락 및 동시성 경합 처리 (REQ-004)
    async function catchDelivery(deliveryRequestId) {
      try {
        const res = await fetch(`/api/v1/delivery-requests/${deliveryRequestId}/catch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        if (res.status === 200 || res.status === 201) {
          showToast('🎉 주문 배정이 완료되었습니다! 진행 화면으로 이동합니다.');
          setTimeout(() => {
            window.location.href = `/matching-complete.html?requestId=${deliveryRequestId}`;
          }, 1500);
        } else if (res.status === 409) {
          // 동시 수락 경합 패배 시 409 Conflict 처리
          showToast('⚠️ 이미 다른 배송원에게 배차된 주문입니다.', true);
          loadAvailableDeliveries(); // 대기열 새로고침
        } else {
          const errData = await res.json();
          showToast(`❌ 수락 실패: ${errData.message || '오류가 발생했습니다.'}`, true);
        }
      } catch (err) {
        showToast('네트워크 요청 중 오류가 발생했습니다.', true);
      }
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast-popup ${isError ? 'toast-error' : ''}`;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }
  </script>
</body>
</html>
