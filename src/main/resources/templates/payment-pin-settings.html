<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 PIN 설정 - Shinhan Delivery</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/my-page.css">
    <script src="/js/my-page-api.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family-base); }
        body.mypage-body { background: linear-gradient(180deg, var(--color-blue-50) 0%, #FAFBFD 42%); }
        body.mypage-body .page { display: flex; flex-direction: column; padding-top: 20px; }
        .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        .back-button { width: 36px; height: 36px; border: 0; border-radius: 999px; background: var(--color-white-100); box-shadow: var(--shadow-sm); color: var(--color-black-200); cursor: pointer; font-size: 18px; }
        .top h1 { font-size: 18px; font-weight: 800; }
        .hero { background: var(--color-white-100); border: 1px solid var(--color-blue-50); border-radius: 24px; padding: 24px; box-shadow: var(--shadow-md); margin-bottom: 20px; }
        .eyebrow { color: var(--color-blue-100); font-size: 12px; font-weight: 800; letter-spacing: 0.08em; }
        .hero h2 { margin-top: 10px; font-size: 28px; font-weight: 800; line-height: 1.25; }
        .hero p { margin-top: 10px; font-size: 14px; color: var(--color-grey-300); line-height: 1.6; }
        .hero.required { border-color: var(--color-blue-100); }
        .form-card { background: var(--color-white-100); border-radius: 24px; padding: 22px; box-shadow: var(--shadow-sm); border: 1px solid var(--color-grey-50); }
        .field + .field { margin-top: 16px; }
        .field label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
        .field input { width: 100%; height: 54px; border-radius: 16px; border: 1px solid var(--color-grey-50); padding: 0 16px; font-size: 16px; letter-spacing: 0.3em; }
        .field input:focus { outline: none; border-color: var(--color-blue-100); box-shadow: 0 0 0 3px rgba(0, 70, 255, 0.08); }
        .helper { min-height: 22px; margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--color-grey-300); }
        .helper.error { color: var(--color-red-200); }
        .helper.ok { color: var(--color-green-300); }
        .cta { margin-top: auto; padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .primary-btn, .secondary-btn { height: 56px; border-radius: 16px; border: 0; font-size: 16px; font-weight: 800; cursor: pointer; }
        .primary-btn { background: var(--color-blue-100); color: var(--color-white-100); box-shadow: var(--shadow-lg); }
        .secondary-btn { background: transparent; color: var(--color-grey-300); border: 1px solid var(--color-grey-50); }
        .secondary-btn[hidden] { display: none; }
    </style>
</head>
<body class="mypage-body">
<main class="page"
      th:classappend="${param.required == null or param.required[0] != '1'} ? ' customer-bottom-nav-content' : ''">
    <header class="top">
        <button id="backButton" class="back-button" type="button" aria-label="뒤로가기">&lt;</button>
        <h1>결제 PIN 설정</h1>
    </header>

    <section id="hero" class="hero">
        <div class="eyebrow">PAYMENT SECURITY</div>
        <h2 id="heroTitle">6자리 결제 PIN을 설정하세요</h2>
        <p id="heroDesc">포인트 결제와 배송 결제 전에 사용할 본인 확인 PIN입니다. 숫자 6자리로 설정해 주세요.</p>
    </section>

    <section class="form-card">
        <div class="field" id="currentPinField" hidden>
            <label for="currentPin">현재 PIN</label>
            <input id="currentPin" type="password" inputmode="numeric" maxlength="6" placeholder="현재 6자리 PIN">
        </div>
        <div class="field">
            <label for="newPin">새 PIN</label>
            <input id="newPin" type="password" inputmode="numeric" maxlength="6" placeholder="새 6자리 PIN">
        </div>
        <div class="field">
            <label for="confirmPin">새 PIN 확인</label>
            <input id="confirmPin" type="password" inputmode="numeric" maxlength="6" placeholder="새 6자리 PIN 다시 입력">
        </div>
        <div id="helperText" class="helper"></div>
    </section>

    <div class="cta">
        <button id="submitButton" type="button" class="primary-btn">결제 PIN 저장</button>
        <button id="skipButton" type="button" class="secondary-btn">나중에 설정</button>
    </div>
</main>

<th:block th:if="${param.required == null or param.required[0] != '1'}">
    <nav th:replace="~{fragments/components :: customerBottomNavigation('myPage')}"></nav>
</th:block>

<script>
    const params = new URLSearchParams(location.search);
    const required = params.get('required') === '1';
    const returnUrl = params.get('returnUrl') || '/my-page';
    let hasPaymentPin = false;

    function setHelper(text, className = '') {
        const el = document.getElementById('helperText');
        el.className = `helper ${className}`.trim();
        el.textContent = text;
    }

    function sanitizePin(value) {
        return (value || '').replace(/\D/g, '').slice(0, 6);
    }

    function updateMode() {
        document.getElementById('currentPinField').hidden = !hasPaymentPin;
        document.getElementById('skipButton').hidden = required;
        if (required) {
            document.getElementById('hero').classList.add('required');
            document.getElementById('heroTitle').textContent = '홈 진입 전에 결제 PIN을 먼저 설정해 주세요';
            document.getElementById('heroDesc').textContent = '보안 강화를 위해 결제 PIN 설정이 필요합니다. 설정 후 홈 화면으로 이동합니다.';
        } else if (hasPaymentPin) {
            document.getElementById('heroTitle').textContent = '결제 PIN을 변경할 수 있어요';
            document.getElementById('heroDesc').textContent = '현재 PIN을 확인한 뒤 새 6자리 PIN으로 변경합니다.';
        }
    }

    async function loadProfile() {
        const profile = await MyPageApi.request('/api/v1/members/me');
        hasPaymentPin = !!profile.hasPaymentPin;
        updateMode();
    }

    async function submitPin() {
        const currentPin = sanitizePin(document.getElementById('currentPin').value);
        const newPin = sanitizePin(document.getElementById('newPin').value);
        const confirmPin = sanitizePin(document.getElementById('confirmPin').value);

        document.getElementById('currentPin').value = currentPin;
        document.getElementById('newPin').value = newPin;
        document.getElementById('confirmPin').value = confirmPin;

        if (hasPaymentPin && currentPin.length !== 6) {
            setHelper('현재 PIN 6자리를 입력해 주세요.', 'error');
            return;
        }
        if (newPin.length !== 6 || confirmPin.length !== 6) {
            setHelper('새 PIN과 확인 PIN은 모두 6자리여야 합니다.', 'error');
            return;
        }

        const submitButton = document.getElementById('submitButton');
        submitButton.disabled = true;
        submitButton.textContent = '저장 중...';

        try {
            await MyPageApi.request('/api/v1/members/payment-pin', {
                method: 'PATCH',
                body: JSON.stringify({
                    currentPin: hasPaymentPin ? currentPin : '',
                    newPin,
                    confirmNewPin: confirmPin
                })
            });
            setHelper('결제 PIN이 저장되었습니다.', 'ok');
            setTimeout(() => location.replace(returnUrl), 600);
        } catch (error) {
            setHelper(error.message, 'error');
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = '결제 PIN 저장';
        }
    }

    document.getElementById('submitButton').addEventListener('click', submitPin);
    document.getElementById('skipButton').addEventListener('click', () => location.href = returnUrl);
    document.getElementById('backButton').addEventListener('click', () => {
        if (required) {
            location.replace('/login');
            return;
        }
        history.back();
    });

    ['currentPin', 'newPin', 'confirmPin'].forEach((id) => {
        const input = document.getElementById(id);
        input.addEventListener('input', () => {
            input.value = sanitizePin(input.value);
        });
    });

    loadProfile().catch(() => {
        setHelper('PIN 설정 정보를 불러오지 못했습니다.', 'error');
    });
</script>
</body>
</html>
