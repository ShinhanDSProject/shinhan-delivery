<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 로그인 - Shinhan Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/pages/login.css}">
    <script th:src="@{/js/pages/login.js}"></script>
</head>
<body>
<main class="page">
    <button class="back-button" type="button" aria-label="이용 방식 선택 페이지로 이동" onclick="location.href='/onboarding?screen=4'"></button>

    <div class="header">
        <h1>이메일 로그인</h1>
        <p>서비스 이용을 위해 로그인 정보를 입력해주세요</p>
    </div>

    <form id="loginForm" novalidate>
        <div class="field">
            <label for="email">이메일 주소</label>
            <input id="email" name="email" type="email" placeholder="example@lumen.com" autocomplete="email" required>
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요" autocomplete="current-password" required>
        </div>
        <p id="message" class="message" role="alert" aria-live="polite"></p>
    </form>

    <div class="bottom">
        <button id="loginButton" class="login-button" type="submit" form="loginForm">로그인</button>
        <nav class="links" aria-label="계정 관련 링크">
            <a href="#" id="forgotPassword">비밀번호를 잊으셨나요?</a>
            <span aria-hidden="true"></span>
            <a class="signup-link" href="/signup">회원가입</a>
        </nav>
    </div>
</main>
</body>
</html>
