<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 변경 - Shinhan Delivery</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/my-page.css">
</head>
<body class="mypage-body">
<main class="page customer-bottom-nav-content">
  <header class="page-header">
    <button class="icon-button" type="button" aria-label="마이페이지로 돌아가기" onclick="location.href='/my-page'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="page-title">비밀번호 변경</h1>
    <span aria-hidden="true"></span>
  </header>

  <form id="passwordForm" novalidate>
    <div class="field-group">
      <label class="field-label" for="currentPassword">현재 비밀번호</label>
      <div class="password-field">
        <input class="field-input" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
        <button class="password-toggle" type="button" data-target="currentPassword" aria-label="현재 비밀번호 표시">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="newPassword">새 비밀번호</label>
      <div class="password-field">
        <input class="field-input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
        <button class="password-toggle" type="button" data-target="newPassword" aria-label="새 비밀번호 표시">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="confirmNewPassword">새 비밀번호 확인</label>
      <div class="password-field">
        <input class="field-input" id="confirmNewPassword" name="confirmNewPassword" type="password" autocomplete="new-password" required>
        <button class="password-toggle" type="button" data-target="confirmNewPassword" aria-label="새 비밀번호 확인 표시">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
      </div>
    </div>

    <ul class="password-rules" aria-live="polite">
      <li id="lengthRule" class="password-rule">8자 이상 100자 이하</li>
      <li id="compositionRule" class="password-rule">영문, 숫자, 특수문자 포함</li>
      <li id="matchRule" class="password-rule">새 비밀번호 확인과 일치</li>
    </ul>

    <button id="changeButton" class="primary-action" type="submit">변경하기</button>
    <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
  </form>

  <nav th:replace="~{fragments/components :: customerBottomNavigation('myPage')}"></nav>
</main>

<script src="/js/my-page-api.js"></script>
<script>
  const form = document.getElementById("passwordForm");
  const currentInput = document.getElementById("currentPassword");
  const newInput = document.getElementById("newPassword");
  const confirmInput = document.getElementById("confirmNewPassword");
  const changeButton = document.getElementById("changeButton");
  const statusMessage = document.getElementById("statusMessage");
  const compositionPattern = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z\d\s]).+$/;

  function updateRules() {
    const password = newInput.value;
    document.getElementById("lengthRule").classList.toggle("is-valid", password.length >= 8 && password.length <= 100);
    document.getElementById("compositionRule").classList.toggle("is-valid", compositionPattern.test(password));
    document.getElementById("matchRule").classList.toggle("is-valid", Boolean(password) && password === confirmInput.value);
  }

  function isValid() {
    return currentInput.value
      && newInput.value.length >= 8
      && newInput.value.length <= 100
      && compositionPattern.test(newInput.value)
      && newInput.value === confirmInput.value;
  }

  document.querySelectorAll(".password-toggle").forEach((button) => {
    button.addEventListener("click", () => {
      const input = document.getElementById(button.dataset.target);
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      button.setAttribute("aria-label", button.getAttribute("aria-label").replace(showing ? "숨기기" : "표시", showing ? "표시" : "숨기기"));
    });
  });

  newInput.addEventListener("input", updateRules);
  confirmInput.addEventListener("input", updateRules);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!isValid()) {
      statusMessage.textContent = "비밀번호 조건과 확인 값을 다시 확인해주세요.";
      statusMessage.className = "status-message is-error";
      return;
    }

    changeButton.disabled = true;
    changeButton.textContent = "변경 중...";
    statusMessage.textContent = "";
    try {
      await MyPageApi.request("/api/v1/members/password", {
        method: "PATCH",
        body: JSON.stringify({
          currentPassword: currentInput.value,
          newPassword: newInput.value,
          confirmNewPassword: confirmInput.value
        })
      });
      statusMessage.textContent = "비밀번호가 변경되었습니다. 다시 로그인해주세요.";
      statusMessage.className = "status-message is-success";
      window.setTimeout(MyPageApi.logout, 1000);
    } catch (error) {
      statusMessage.textContent = error.message;
      statusMessage.className = "status-message is-error";
      changeButton.disabled = false;
      changeButton.textContent = "변경하기";
    }
  });

  MyPageApi.requireToken();
</script>
</body>
</html>
