<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 포털 로그인 - Shinhan Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/design-system.css">
    <style>
        :root {
            --primary: var(--color-blue-100);
            --primary-hover: var(--color-blue-500);
            --text-dark: var(--color-black-200);
            --text-muted: var(--color-grey-300);
            --input-bg: var(--color-white-100);
            --input-border: var(--color-grey-50);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f9 0%, #e2e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-dark);
        }

        .page {
            position: relative;
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px 36px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 70, 255, 0.08);
            transition: transform 0.3s ease;
        }

        .back-button {
            position: absolute;
            top: 36px;
            left: 28px;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .back-button:hover {
            background: #f1f5f9;
        }

        .header {
            margin-top: 16px;
            margin-bottom: 32px;
        }

        .badge-admin {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background: var(--color-blue-50);
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.5px;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 70, 255, 0.1);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .submit-button {
            width: 100%;
            height: 54px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(0, 70, 255, 0.25);
            transition: all 0.2s ease;
        }

        .submit-button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .error-message {
            margin-bottom: 16px;
            padding: 12px 14px;
            background: #fef2f2;
            border: 1px solid #fee2e2;
            border-radius: 10px;
            color: #ef4444;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .footer-note {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-note a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="page">
        <button class="back-button" type="button" aria-label="이전 페이지로 이동" onclick="location.href='/onboarding?screen=4'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
        </button>

        <div class="header">
            <span class="badge-admin">🛡️ 관리자 포털</span>
            <h1 class="title">관리자 로그인</h1>
            <p class="subtitle">Shinhan Delivery 자격 심사 및 시스템 관리 포털입니다.</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label class="label" for="email">관리자 이메일</label>
                <input type="email" id="email" class="input-field" placeholder="admin@shinhan.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="label" for="password">비밀번호</label>
                <input type="password" id="password" class="input-field" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
            </div>

            <button type="submit" class="submit-button" id="btnSubmit">관리자 로그인</button>
        </form>

        <div class="footer-note">
            일반 회원 서비스로 돌아가시겠습니까? <a href="/login">고객 로그인</a>
        </div>
    </div>

    <script>
        async function handleAdminLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const btnSubmit = document.getElementById('btnSubmit');

            errorMsg.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.textContent = '인증 확인 중...';

            try {
                const res = await fetch('/api/v1/members/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.message || '이메일 또는 비밀번호가 올바르지 않습니다.');
                }

                const data = await res.json();
                const token = data.accessToken;

                // 본인 프로필 조회로 ADMIN 권한 검증
                const meRes = await fetch('/api/v1/members/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!meRes.ok) {
                    throw new Error('프로필 정보를 불러오는데 실패했습니다.');
                }

                const me = await meRes.json();
                if (me.role !== 'ADMIN') {
                    throw new Error('관리자 권한이 없는 계정입니다.');
                }

                // 토큰 저장
                localStorage.setItem('accessToken', token);
                document.cookie = `accessToken=${token}; path=/; max-age=86400;`;

                window.location.href = '/admin-dashboard';
            } catch (err) {
                errorMsg.textContent = `❌ ${err.message}`;
                errorMsg.style.display = 'block';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = '관리자 로그인';
            }
        }
    </script>
</body>
</html>
