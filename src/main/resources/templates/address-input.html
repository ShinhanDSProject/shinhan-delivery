<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송 신청 예약 - Shinhan Delivery</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <script src="/js/utils/geo.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bc0d2e17087637bd52851cb9a43d19df&libraries=services&autoload=false"></script>
    <style>
        :root {
            --primary: var(--color-blue-500);
            --text-dark: var(--color-black-200);
            --text-muted: var(--color-grey-500);
            --surface: #F8F8F8;
            --border: var(--color-grey-50);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family-base);
        }

        body {
            min-height: 100vh;
            color: var(--text-dark);
            background: var(--surface);
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        header.top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
        }

        .back-button {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 999px;
            border: 0;
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        header.top h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 8px 16px 12px;
        }

        .reorder-notice {
            padding: 12px 14px;
            border: 1px solid var(--color-blue-100);
            border-radius: 12px;
            background: var(--color-blue-50);
            color: var(--color-blue-500);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .field-box {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 52px;
            padding: 0 12px;
            background: var(--surface);
            border: 0;
            border-radius: 16px;
            width: 100%;
            text-align: left;
            cursor: pointer;
            font-family: var(--font-family-base);
        }

        .field-box svg {
            width: 20px;
            height: 20px;
            min-width: 20px;
            color: var(--text-muted);
        }

        .field-box .value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .field-box .value.placeholder {
            font-weight: 400;
            color: var(--text-muted);
        }

        .recent-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .recent-section > span {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            padding: 12px;
            background: #fff;
            border-radius: 16px;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: transparent;
            border: 0;
            text-align: left;
            padding: 0;
            cursor: pointer;
            font-family: var(--font-family-base);
        }

        .recent-item svg {
            width: 18px;
            height: 18px;
            min-width: 18px;
            color: var(--text-muted);
        }

        .recent-item .title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .recent-item .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .recent-divider {
            height: 1px;
            background: #E5E7EB;
        }

        .recent-empty {
            font-size: 13px;
            color: var(--text-muted);
            padding: 4px 0;
        }

        .fee-card {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 80px;
            padding: 0 16px;
            background: #fff;
            border: 1px solid var(--primary);
            border-radius: 20px;
        }

        .fee-card.visible {
            display: flex;
        }

        .fee-card .fee-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .fee-card .fee-value {
            font-size: 25px;
            font-weight: 800;
            color: var(--primary);
            margin-top: 6px;
        }

        .fee-card .fee-meta {
            width: 140px;
            text-align: right;
            font-size: 10px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .fee-loading {
            font-size: 13px;
            color: var(--text-muted);
            padding: 8px 0;
        }

        footer.bottom {
            display: flex;
            justify-content: center;
            padding: 16px;
            margin-top: auto;
        }

        footer.bottom button {
            width: 100%;
            max-width: 350px;
            height: 60px;
            border: 0;
            border-radius: 15px;
            background: var(--primary);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        footer.bottom button:disabled {
            background: var(--color-grey-100);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<main class="page">
    <header class="top">
        <button class="back-button" type="button" aria-label="홈으로 이동" onclick="location.href='/home'">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1>배송 신청 예약</h1>
    </header>

    <div class="form">
        <div class="reorder-notice" id="reorderNotice" hidden>
            이전 배송 정보를 자동으로 채웠어요. 내용을 확인하고 필요하면 수정해 주세요.
        </div>
        <div th:replace="~{fragments/components :: addressQuickChipSelector}"></div>
        <div class="field">
            <label>출발지 (문앞 픽업)</label>
            <button type="button" class="field-box" id="pickupField" onclick="goToPickupMap()">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
                <span class="value placeholder" id="pickupValue">위치 확인 중...</span>
            </button>
        </div>

        <div class="field">
            <label>도착지 (상대방 문앞)</label>
            <button type="button" class="field-box" id="dropoffField" onclick="goToDestinationMap()">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span class="value placeholder" id="dropoffValue">도착지 주소를 검색하세요</span>
            </button>
        </div>

        <div class="recent-section">
            <span>최근 목록</span>
            <div class="recent-list" id="recentList">
                <div class="recent-empty">불러오는 중...</div>
            </div>
        </div>

        <div class="field">
            <label>픽업 가이드</label>
            <button type="button" class="field-box" id="pickupGuideField" onclick="location.href='/pickup-guide'">
                <svg viewBox="0 0 24 24" fill="none"><path d="M9 12h6M9 16h6M9 8h1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
                <span class="value placeholder" id="pickupGuideValue">픽업 가이드를 입력해주세요</span>
            </button>
        </div>

        <div class="field">
            <label>물품 정보</label>
            <button type="button" class="field-box" id="itemDetailField" onclick="location.href='/item-detail'">
                <svg viewBox="0 0 24 24" fill="none"><path d="M21 8V21H3V8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M1 3h22v5H1z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span class="value placeholder" id="itemDetailValue">물품 정보를 입력해주세요</span>
            </button>
        </div>

        <div class="fee-card" id="feeCard">
            <div>
                <div class="fee-label">자동 산정 예상 요금</div>
                <div class="fee-value" id="feeValue">- Point</div>
            </div>
            <div class="fee-meta">
                <span id="feeDistance">거리: -</span>
                <span id="feeBalance">보유 - pt</span>
            </div>
        </div>
        <div class="fee-loading" id="feeLoading" style="display:none;">예상 요금 계산 중...</div>
    </div>

    <footer class="bottom">
        <button type="button" id="nextButton" disabled onclick="onNext()">다음</button>
    </footer>
</main>

<script>
    const SIZE_LABEL = { SMALL: '소형', MEDIUM: '중형', LARGE: '대형' };
    let selectedAddressTarget = 'dropoff';
    let latestAddressSelectionRequest = 0;
    const selectedAddressIdByTarget = { pickup: null, dropoff: null };

    function authHeader() {
        const token = localStorage.getItem('accessToken');
        const tokenType = localStorage.getItem('tokenType') || 'Bearer';
        if (!token) return null;
        return `${tokenType} ${token}`;
    }

    function showToast(message) {
        const existing = document.getElementById('toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.id = 'toast';
        toast.textContent = message;
        toast.style.cssText =
            'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);' +
            'background:#1e293b;color:#fff;padding:10px 20px;border-radius:999px;' +
            'font-size:13px;z-index:100;';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    function notReady() {
        showToast('아직 준비 중인 기능입니다.');
    }

    function goToPickupMap() {
        location.href = '/pickup-map';
    }

    function goToDestinationMap() {
        location.href = '/destination-map';
    }

    function renderPoint(field, point) {
        const el = document.getElementById(field === 'pickup' ? 'pickupValue' : 'dropoffValue');
        if (!point || !point.address) {
            el.textContent = field === 'pickup' ? '위치를 확인할 수 없어요. 눌러서 지정해주세요.' : '도착지 주소를 검색하세요';
            el.classList.add('placeholder');
            return;
        }
        el.textContent = point.detail ? `${point.address} (${point.detail})` : point.address;
        el.classList.remove('placeholder');
    }

    function iconForAlias(alias) {
        const normalizedAlias = (alias || '').replaceAll(' ', '').toLowerCase();
        if (normalizedAlias.includes('집') || normalizedAlias.includes('home')) return '🏠';
        if (normalizedAlias.includes('회사') || normalizedAlias.includes('직장') || normalizedAlias.includes('office')) return '🏢';
        return '📍';
    }

    function setAddressTarget(target) {
        if (target !== 'pickup' && target !== 'dropoff') return;
        selectedAddressTarget = target;
        latestAddressSelectionRequest += 1;
        document.querySelectorAll('[data-address-target]').forEach((button) => {
            const active = button.dataset.addressTarget === target;
            button.classList.toggle('active', active);
            button.setAttribute('aria-pressed', String(active));
        });
        document.querySelectorAll('.quick-address-chip').forEach((chip) => {
            chip.setAttribute('aria-label', `${chip.dataset.addressAlias} 주소를 ${target === 'pickup' ? '출발지' : '목적지'}에 입력`);
        });
        renderSelectedAddressChip();
    }

    function renderSelectedAddressChip() {
        document.querySelectorAll('.quick-address-chip').forEach((chip) => {
            const active = Number(chip.dataset.addressId) === selectedAddressIdByTarget[selectedAddressTarget];
            chip.classList.toggle('active', active);
            chip.setAttribute('aria-pressed', String(active));
        });
    }

    function renderQuickAddressChips(addresses) {
        const chipList = document.getElementById('quickAddressList');
        chipList.replaceChildren();
        if (addresses.length === 0) {
            const empty = document.createElement('span');
            empty.className = 'quick-address-empty';
            empty.textContent = '등록된 주소가 없어요.';
            chipList.appendChild(empty);
            return;
        }
        addresses.forEach((addr) => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'quick-address-chip';
            chip.dataset.addressId = String(addr.id);
            chip.dataset.addressAlias = addr.alias;
            chip.setAttribute('aria-pressed', 'false');
            chip.setAttribute('aria-label', `${addr.alias} 주소를 ${selectedAddressTarget === 'pickup' ? '출발지' : '목적지'}에 입력`);
            chip.textContent = `${iconForAlias(addr.alias)} ${addr.alias}`;
            chip.addEventListener('click', () => selectSavedAddress(addr));
            chipList.appendChild(chip);
        });
    }

    async function loadRecentAddresses() {
        const listEl = document.getElementById('recentList');
        const chipList = document.getElementById('quickAddressList');
        const header = authHeader();
        if (!header) return;
        try {
            const response = await fetch('/api/v1/addresses', { headers: { Authorization: header } });
            if (!response.ok) throw new Error('failed');
            const addresses = await response.json();
            renderQuickAddressChips(addresses);
            if (addresses.length === 0) {
                listEl.innerHTML = '<div class="recent-empty">자주 쓰는 주소가 없어요.</div>';
                return;
            }
            listEl.innerHTML = '';
            addresses.forEach((addr, idx) => {
                if (idx > 0) {
                    const divider = document.createElement('div');
                    divider.className = 'recent-divider';
                    listEl.appendChild(divider);
                }
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'recent-item';

                const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                icon.setAttribute('viewBox', '0 0 24 24');
                icon.setAttribute('fill', 'none');
                icon.innerHTML =
                    '<path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21z" stroke="currentColor" stroke-width="1.8"/>' +
                    '<circle cx="12" cy="9.5" r="2.5" stroke="currentColor" stroke-width="1.8"/>';

                const textWrap = document.createElement('span');
                const title = document.createElement('span');
                title.className = 'title';
                title.style.display = 'block';
                title.textContent = addr.alias;
                const subtitle = document.createElement('span');
                subtitle.className = 'subtitle';
                subtitle.textContent = addr.address + (addr.detailAddress ? ' ' + addr.detailAddress : '');
                textWrap.appendChild(title);
                textWrap.appendChild(subtitle);

                item.appendChild(icon);
                item.appendChild(textWrap);
                item.addEventListener('click', () => selectSavedAddress(addr));
                listEl.appendChild(item);
            });
        } catch (error) {
            listEl.innerHTML = '<div class="recent-empty">최근 목록을 불러오지 못했어요.</div>';
            chipList.replaceChildren();
            const empty = document.createElement('span');
            empty.className = 'quick-address-empty';
            empty.textContent = '주소를 불러오지 못했어요.';
            chipList.appendChild(empty);
        }
    }

    function isValidCoordinate(lat, lng) {
        return Number.isFinite(lat) && Number.isFinite(lng)
            && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
    }

    function applySavedAddress(addr, target, requestId, lat, lng) {
        if (requestId !== latestAddressSelectionRequest || !isValidCoordinate(lat, lng)) return false;
        const draft = loadDraft();
        draft[target] = {
            address: addr.address,
            detail: addr.detailAddress || '',
            lat,
            lng
        };
        saveDraft(draft);
        selectedAddressIdByTarget[target] = Number(addr.id);
        renderPoint(target, draft[target]);
        renderSelectedAddressChip();
        maybeEstimateFee();
        return true;
    }

    function selectSavedAddress(addr) {
        const target = selectedAddressTarget;
        const requestId = ++latestAddressSelectionRequest;
        const savedLat = Number.parseFloat(addr.latitude);
        const savedLng = Number.parseFloat(addr.longitude);
        if (isValidCoordinate(savedLat, savedLng)) {
            applySavedAddress(addr, target, requestId, savedLat, savedLng);
            return;
        }
        if (!window.kakao || !window.kakao.maps) {
            showToast('지도 서비스를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
            return;
        }
        kakao.maps.load(() => {
            const geocoder = new kakao.maps.services.Geocoder();
            geocoder.addressSearch(addr.address, (results, status) => {
                if (requestId !== latestAddressSelectionRequest) return;
                if (status !== kakao.maps.services.Status.OK || results.length === 0) {
                    showToast('저장된 주소의 위치를 찾지 못했어요. 주소 관리에서 확인해 주세요.');
                    return;
                }
                const lat = Number.parseFloat(results[0].y);
                const lng = Number.parseFloat(results[0].x);
                if (!applySavedAddress(addr, target, requestId, lat, lng)) {
                    showToast('주소의 좌표가 올바르지 않아요. 주소 관리에서 확인해 주세요.');
                }
            });
        });
    }

    function detectCurrentLocation() {
        const draft = loadDraft();
        if (draft.pickup && draft.pickup.address) {
            renderPoint('pickup', draft.pickup);
            maybeEstimateFee();
            return;
        }
        if (!navigator.geolocation) {
            renderPoint('pickup', null);
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                if (!window.kakao || !window.kakao.maps) {
                    renderPoint('pickup', null);
                    return;
                }
                kakao.maps.load(() => {
                    const geocoder = new kakao.maps.services.Geocoder();
                    geocoder.coord2Address(lng, lat, (results, status) => {
                        const address =
                            status === kakao.maps.services.Status.OK && results.length > 0
                                ? results[0].address.address_name
                                : `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                        const draft2 = loadDraft();
                        draft2.pickup = { address, detail: '내 위치', lat, lng };
                        saveDraft(draft2);
                        renderPoint('pickup', draft2.pickup);
                        maybeEstimateFee();
                    });
                });
            },
            () => renderPoint('pickup', null)
        );
    }

    function renderPickupGuideSummary(draft) {
        const el = document.getElementById('pickupGuideValue');
        if (!draft.pickupGuide || !draft.pickupGuide.deliveryInstructionType) {
            el.textContent = '픽업 가이드를 입력해주세요';
            el.classList.add('placeholder');
            return;
        }
        const labels = {
            LEAVE_AT_DOOR_NO_BELL: '문 앞에 두고 벨 누르지 않기',
            ENTRANCE_CODE: '공동현관 출입번호 사용',
            SECURITY_OFFICE: '경비실에 맡기기',
            CUSTOM: draft.pickupGuide.deliveryNote || '기타 전달 요청'
        };
        el.textContent = labels[draft.pickupGuide.deliveryInstructionType] || '전달 지침 입력 완료';
        el.classList.remove('placeholder');
    }

    function renderItemDetailSummary(draft) {
        const el = document.getElementById('itemDetailValue');
        if (!draft.itemSize || !draft.weight || !draft.categoryName) {
            el.textContent = '물품 정보를 입력해주세요';
            el.classList.add('placeholder');
            return;
        }
        el.textContent = `${SIZE_LABEL[draft.itemSize] || draft.itemSize} · ${draft.categoryName} · ${draft.weight}kg`;
        el.classList.remove('placeholder');
    }

    let myMemberId = null;
    let myPointBalance = null;
    let latestEstimate = null;

    async function loadMyPointBalance() {
        const header = authHeader();
        if (!header) return;
        try {
            const meResponse = await fetch('/api/v1/members/me', { headers: { Authorization: header } });
            if (!meResponse.ok) return;
            const me = await meResponse.json();
            myMemberId = me.id;
            const walletsResponse = await fetch('/api/v1/point-wallets', { headers: { Authorization: header } });
            if (!walletsResponse.ok) return;
            const wallets = await walletsResponse.json();
            const myWallet = wallets.find((w) => w.memberId === myMemberId);
            myPointBalance = myWallet ? myWallet.balance : 0;
        } catch (error) {
            myPointBalance = null;
        }
    }

    let estimateTimer = null;

    function clearStoredEstimate() {
        const draft = loadDraft();
        delete draft.paymentEstimate;
        saveDraft(draft);
    }

    function maybeEstimateFee() {
        const draft = loadDraft();
        const feeCard = document.getElementById('feeCard');
        const feeLoading = document.getElementById('feeLoading');
        const nextButton = document.getElementById('nextButton');

        if (!draft.pickup || !draft.dropoff || !draft.itemSize || !draft.weight) {
            feeCard.classList.remove('visible');
            feeLoading.style.display = 'none';
            latestEstimate = null;
            clearStoredEstimate();
            nextButton.disabled = true;
            return;
        }

        clearTimeout(estimateTimer);
        estimateTimer = setTimeout(async () => {
            feeCard.classList.remove('visible');
            feeLoading.style.display = 'block';
            const itemSize = draft.itemSize;
            const weight = draft.weight;

            try {
                const response = await fetch('/api/v1/delivery-requests/estimate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pickupLatitude: draft.pickup.lat,
                        pickupLongitude: draft.pickup.lng,
                        destinationLatitude: draft.dropoff.lat,
                        destinationLongitude: draft.dropoff.lng,
                        weight,
                        itemSize
                    })
                });
                feeLoading.style.display = 'none';
                if (!response.ok) {
                    latestEstimate = null;
                    clearStoredEstimate();
                    nextButton.disabled = true;
                    return;
                }
                const estimate = await response.json();
                latestEstimate = estimate;
                document.getElementById('feeValue').textContent =
                    `${Number(estimate.totalFee).toLocaleString()} Point`;

                const km = haversineKm(draft.pickup.lat, draft.pickup.lng, draft.dropoff.lat, draft.dropoff.lng);
                document.getElementById('feeDistance').textContent = `거리: ~${km.toFixed(1)}km`;

                if (myPointBalance === null) {
                    await loadMyPointBalance();
                }
                document.getElementById('feeBalance').textContent =
                    myPointBalance === null ? '보유 포인트 확인 불가' : `보유 ${myPointBalance.toLocaleString()} pt`;

                const draftWithEstimate = loadDraft();
                draftWithEstimate.paymentEstimate = {
                    baseFee: Number(estimate.baseFee),
                    distanceSurcharge: Number(estimate.distanceSurcharge),
                    weightSurcharge: Number(estimate.weightSurcharge),
                    sizeSurcharge: Number(estimate.sizeSurcharge),
                    totalFee: Number(estimate.totalFee),
                    walletBalance: myPointBalance ?? 0,
                    estimatedDistanceKm: Number(km.toFixed(1))
                };
                saveDraft(draftWithEstimate);

                feeCard.classList.add('visible');
                nextButton.disabled = false;
            } catch (error) {
                feeLoading.style.display = 'none';
                latestEstimate = null;
                clearStoredEstimate();
                nextButton.disabled = true;
            }
        }, 300);
    }

    function onNext() {
        if (!latestEstimate) {
            notReady();
            return;
        }
        location.href = '/payment-confirmation';
    }

    (function init() {
        if (!authHeader()) {
            location.replace('/login');
            return;
        }
        let draft = loadDraft();
        if (draft.paymentStatus === 'COMPLETED') {
            draft = resetPaymentState(draft);
        }
        if (draft.reorderSourceId && new URLSearchParams(location.search).get('reorder') === 'success') {
            document.getElementById('reorderNotice').hidden = false;
        }
        renderPickupGuideSummary(draft);
        renderItemDetailSummary(draft);
        renderPoint('pickup', draft.pickup);
        renderPoint('dropoff', draft.dropoff);
        document.querySelectorAll('[data-address-target]').forEach((button) => {
            button.addEventListener('click', () => setAddressTarget(button.dataset.addressTarget));
        });
        detectCurrentLocation();
        loadRecentAddresses();
        maybeEstimateFee();
    })();
</script>
</body>
</html>
