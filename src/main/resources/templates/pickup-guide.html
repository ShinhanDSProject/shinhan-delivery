<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송 현장 전달 지침 - Shinhan Delivery</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <script src="/js/utils/storage.js"></script>
    <style>
        :root {
            --primary: var(--color-blue-500);
            --text-dark: var(--color-black-200);
            --text-muted: var(--color-grey-300);
            --surface: #FAFBFD;
            --border: var(--color-grey-50);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family-base);
        }

        body {
            min-height: 100vh;
            color: var(--text-dark);
            background: #fff;
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        header.top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
        }

        .back-button {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 999px;
            border: 0;
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        header.top h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            flex: 1;
        }

        .delivery-instruction-fields {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xl);
        }

        .instruction-options {
            border: 0;
        }

        .instruction-options legend,
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--color-grey-300);
            margin-bottom: var(--spacing-sm);
        }

        .instruction-options label {
            padding: var(--spacing-md);
            border: 1px solid var(--color-grey-50);
            border-radius: var(--radius-sm);
            margin-bottom: var(--spacing-sm);
            font-weight: 500;
            cursor: pointer;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #4A5568;
            margin-bottom: 6px;
        }

        .field input[type="text"],
        .field input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: var(--font-family-base);
            font-size: 14px;
            color: var(--text-dark);
        }

        .field-help {
            margin-top: var(--spacing-xs);
            color: var(--color-grey-300);
            font-size: 12px;
        }

        .form-error {
            min-height: 18px;
            color: var(--color-red-100);
            font-size: 13px;
        }

        .field textarea {
            width: 100%;
            min-height: 100px;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: var(--font-family-base);
            font-size: 14px;
            color: var(--text-dark);
            resize: vertical;
        }

        .photo-upload {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
        }

        .photo-upload svg {
            width: 24px;
            height: 24px;
            color: #4A5568;
        }

        .photo-upload span {
            font-size: 13px;
            font-weight: 600;
            color: #4A5568;
        }

        .photo-preview {
            display: none;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .photo-preview.visible {
            display: block;
        }

        .photo-preview img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }

        .photo-preview button {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 0;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            cursor: pointer;
        }

        footer.bottom {
            display: flex;
            justify-content: center;
            padding: 16px;
        }

        footer.bottom button {
            width: 100%;
            max-width: 350px;
            height: 56px;
            border: 0;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main class="page">
    <header class="top">
        <button class="back-button" type="button" aria-label="뒤로 가기" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1>배송 현장 전달 지침</h1>
    </header>

    <form class="form" id="deliveryInstructionForm">
        <div th:replace="~{fragments/components :: deliveryInstructionFields}"></div>
    </form>

    <footer class="bottom">
        <button th:replace="~{fragments/components :: primaryBtnForForm('확인', 'deliveryInstructionForm', 'confirmButton')}">확인</button>
    </footer>
</main>

<script>
    function authHeader() {
        const token = localStorage.getItem('accessToken');
        const tokenType = localStorage.getItem('tokenType') || 'Bearer';
        if (!token) return null;
        return `${tokenType} ${token}`;
    }

    let uploadedPhotoUrl = null;

    function selectedInstructionType() {
        return document.querySelector('input[name="deliveryInstructionType"]:checked')?.value || null;
    }

    function renderConditionalFields() {
        const type = selectedInstructionType();
        document.getElementById('entranceCodeField').hidden = type !== 'ENTRANCE_CODE';
        document.getElementById('deliveryNoteField').hidden = type !== 'CUSTOM';
    }

    document.querySelectorAll('input[name="deliveryInstructionType"]').forEach((input) => {
        input.addEventListener('change', renderConditionalFields);
    });

    document.getElementById('photoUploadBtn').addEventListener('click', () => {
        document.getElementById('photoInput').click();
    });

    document.getElementById('photoInput').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const label = document.getElementById('photoUploadLabel');
        label.textContent = '업로드 중...';
        try {
            const formData = new FormData();
            formData.append('file', file);
            const header = authHeader();
            const response = await fetch('/api/v1/uploads/image', {
                method: 'POST',
                headers: header ? { Authorization: header } : undefined,
                body: formData
            });
            if (!response.ok) throw new Error('upload failed');
            const result = await response.json();
            uploadedPhotoUrl = result.imageUrl;

            document.getElementById('photoPreviewImg').src = uploadedPhotoUrl;
            document.getElementById('photoPreview').classList.add('visible');
            document.getElementById('photoUploadBtn').style.display = 'none';
        } catch (error) {
            label.textContent = '업로드에 실패했어요. 다시 시도해주세요';
        }
    });

    document.getElementById('photoRemoveBtn').addEventListener('click', () => {
        uploadedPhotoUrl = null;
        document.getElementById('photoInput').value = '';
        document.getElementById('photoPreview').classList.remove('visible');
        document.getElementById('photoUploadBtn').style.display = 'flex';
        document.getElementById('photoUploadLabel').textContent = '사진 찍어 추가하기';
    });

    function confirmGuide(event) {
        event.preventDefault();
        const type = selectedInstructionType();
        const entranceCode = document.getElementById('entranceCode').value.trim();
        const deliveryNote = document.getElementById('deliveryNote').value.trim();
        const error = document.getElementById('formError');
        if (!type) {
            error.textContent = '전달 방식을 선택해주세요.';
            return;
        }
        if (type === 'ENTRANCE_CODE' && !entranceCode) {
            error.textContent = '공동현관 출입번호를 입력해주세요.';
            return;
        }
        if (type === 'CUSTOM' && !deliveryNote) {
            error.textContent = '기타 전달 요청을 입력해주세요.';
            return;
        }
        const draft = loadDraft();
        draft.pickupGuide = {
            deliveryInstructionType: type,
            entranceCode: type === 'ENTRANCE_CODE' ? entranceCode : '',
            unitDetail: document.getElementById('unitDetail').value.trim(),
            deliveryNote: type === 'CUSTOM' ? deliveryNote : '',
            photoUrl: uploadedPhotoUrl
        };
        saveDraft(draft);
        location.href = '/address-input';
    }

    document.getElementById('deliveryInstructionForm').addEventListener('submit', confirmGuide);

    (function init() {
        if (!authHeader()) {
            location.replace('/login');
            return;
        }
        const draft = loadDraft();
        if (draft.pickupGuide) {
            const type = draft.pickupGuide.deliveryInstructionType;
            const selected = document.querySelector(`input[name="deliveryInstructionType"][value="${type}"]`);
            if (selected) selected.checked = true;
            document.getElementById('entranceCode').value = draft.pickupGuide.entranceCode || '';
            document.getElementById('unitDetail').value = draft.pickupGuide.unitDetail || '';
            document.getElementById('deliveryNote').value = draft.pickupGuide.deliveryNote || '';
            if (draft.pickupGuide.photoUrl) {
                uploadedPhotoUrl = draft.pickupGuide.photoUrl;
                document.getElementById('photoPreviewImg').src = uploadedPhotoUrl;
                document.getElementById('photoPreview').classList.add('visible');
                document.getElementById('photoUploadBtn').style.display = 'none';
            }
        }
        renderConditionalFields();
    })();
</script>
</body>
</html>
