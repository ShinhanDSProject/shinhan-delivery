<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배송 내역 - 신한 딜리버리</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/pages/delivery-history.css}">
    <script src="/js/utils/auth.js"></script>
    <script src="/js/utils/format.js"></script>
    <script src="/js/utils/ui.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/delivery-reorder.js"></script>
    <script th:src="@{/js/pages/delivery-history.js}"></script>
</head>
<body>
<main class="page customer-bottom-nav-content">
    <header class="top">
        <button class="back-button" type="button" aria-label="마이페이지로 돌아가기" onclick="location.href='/my-page'">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1>배송 내역</h1>
    </header>

    <nav class="tabs" id="tabs">
        <button type="button" class="active" data-tab="ALL">전체</button>
        <button type="button" data-tab="IN_PROGRESS">진행중</button>
        <button type="button" data-tab="COMPLETED">완료</button>
        <button type="button" data-tab="CANCELLED">취소</button>
    </nav>

    <div class="history-list" id="list">
        <article th:each="item : ${deliveries}" class="history-card" tabindex="0" role="link" th:onclick="|location.href='${item.status == 'CANCELLED' ? '/cancel-detail?id=' + item.id : '/delivery-detail?id=' + item.id}'|">
            <div class="card-top">
                <span class="date" th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'yyyy.MM.dd') : ''}">2026.08.18</span>
                <span class="status-badge" th:classappend="${item.status == 'COMPLETED' ? 'completed' : (item.status == 'CANCELLED' ? 'cancelled' : 'in-progress')}" th:text="${item.status == 'COMPLETED' ? '완료' : (item.status == 'CANCELLED' ? '취소' : '진행중')}">완료</span>
            </div>
            <div class="card-mid">
                <div class="route" th:text="${item.pickupAddress + ' → ' + item.dropoffAddress}">픽업지 → 배송지</div>
            </div>
            <div class="card-bottom">
                <span class="fee" th:text="${#numbers.formatInteger(item.feePoint, 0, 'COMMA') + ' P'}">0 P</span>
                <button class="reorder-button" type="button">이 배송 다시 보내기</button>
            </div>
        </article>
    </div>
</main>

<nav th:replace="~{fragments/components :: customerBottomNavigation('myPage')}"></nav>
</body>
</html>
