<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 PIN 입력 - Shinhan Delivery</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <script src="/js/my-page-api.js"></script>
    <script src="/js/utils/storage.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family-base); }
        body { min-height: 100vh; background: linear-gradient(180deg, #eff6ff 0%, #ffffff 45%); color: var(--color-black-200); }
        .page { max-width: 480px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; padding: 16px 20px 24px; }
        .top { display: flex; align-items: center; gap: 12px; }
        .back-button { width: 32px; height: 32px; border: 0; border-radius: 999px; background: rgba(0, 0, 0, 0.04); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .top h1 { font-size: 18px; font-weight: 800; }
        .hero { text-align: center; padding: 28px 0 18px; }
        .hero .eyebrow { color: var(--color-blue-100); font-size: 12px; font-weight: 800; letter-spacing: 0.06em; }
        .hero h2 { font-size: 26px; font-weight: 800; margin-top: 10px; }
        .hero p { font-size: 14px; color: var(--color-grey-300); line-height: 1.6; margin-top: 10px; }
        .amount-card { background: #fff; border-radius: 22px; padding: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--color-blue-50); text-align: center; }
        .amount-card .label { font-size: 13px; color: var(--color-grey-300); }
        .amount-card .value { font-size: 28px; font-weight: 800; margin-top: 8px; color: var(--color-blue-100); }
        .pin-dots { display: flex; justify-content: center; gap: 12px; margin: 28px 0 20px; }
        .dot { width: 16px; height: 16px; border-radius: 999px; border: 2px solid var(--color-grey-50); background: #fff; transition: all .2s ease; }
        .dot.filled { background: var(--color-blue-500); border-color: var(--color-blue-500); transform: scale(1.05); }
        .helper { text-align: center; min-height: 22px; font-size: 13px; font-weight: 700; color: var(--color-grey-300); margin-bottom: 18px; }
        .helper.error { color: var(--color-red-200); }
        .helper.ok { color: var(--color-green-300); }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .keypad button { height: 68px; border: 0; border-radius: 20px; background: #fff; box-shadow: var(--shadow-sm); font-size: 24px; font-weight: 800; color: var(--color-black-200); cursor: pointer; }
        .keypad button.alt { font-size: 14px; color: var(--color-grey-300); }
        .pin-actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 20px; }
        .primary-btn, .secondary-btn { height: 56px; border-radius: 16px; border: 0; font-size: 16px; font-weight: 800; cursor: pointer; }
        .primary-btn { background: var(--color-blue-500); color: #fff; box-shadow: var(--shadow-lg); }
        .primary-btn:disabled { background: var(--color-grey-100); box-shadow: none; cursor: not-allowed; }
        .secondary-btn { background: transparent; color: var(--color-grey-300); border: 1px solid var(--color-grey-50); }
    </style>
</head>
<body>
<main class="page">
    <header class="top">
        <button class="back-button" type="button" aria-label="뒤로 가기" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1>결제 PIN 입력</h1>
    </header>

    <section class="hero">
        <div class="eyebrow">STEP 2 · SECURITY PIN</div>
        <h2>6자리 결제 PIN을 입력해 주세요</h2>
        <p>안전한 결제를 위해 등록한 결제 PIN을 확인합니다.</p>
    </section>

    <div class="amount-card">
        <div class="label">결제 예정 금액</div>
        <div class="value" id="totalFee">0 P</div>
    </div>

    <div class="pin-dots" id="pinDots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="helper" id="helperText"></div>

    <div class="keypad" id="keypad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" class="alt" data-action="clear">전체 삭제</button>
        <button type="button" data-key="0">0</button>
        <button type="button" class="alt" data-action="delete">지우기</button>
    </div>

    <div class="pin-actions">
        <button type="button" class="primary-btn" id="confirmButton" disabled onclick="submitPin()">결제 요청하기</button>
        <button type="button" class="secondary-btn" onclick="history.back()">결제 금액 다시 확인</button>
    </div>
</main>

<script>
    let pinValue = '';

    function getAuthHeader() {
        const token = localStorage.getItem('accessToken');
        const tokenType = localStorage.getItem('tokenType') || 'Bearer';
        return token ? `${tokenType} ${token}` : null;
    }

    function formatPoint(value) {
        return `${Number(value || 0).toLocaleString()} P`;
    }

    function renderDots() {
        document.querySelectorAll('.dot').forEach((dot, index) => {
            dot.classList.toggle('filled', index < pinValue.length);
        });
        document.getElementById('confirmButton').disabled = pinValue.length !== 6;
    }

    function setHelper(text, className = '') {
        const el = document.getElementById('helperText');
        el.className = `helper ${className}`.trim();
        el.textContent = text;
    }

    function onKeypadClick(event) {
        const keyButton = event.target.closest('button');
        if (!keyButton) {
            return;
        }

        const key = keyButton.dataset.key;
        const action = keyButton.dataset.action;

        if (key && pinValue.length < 6) {
            pinValue += key;
        }
        if (action === 'delete') {
            pinValue = pinValue.slice(0, -1);
        }
        if (action === 'clear') {
            pinValue = '';
        }
        renderDots();
    }

    async function verifyPin(pin) {
        const authHeader = getAuthHeader();
        if (!authHeader) {
            location.replace('/login');
            throw new Error('LOGIN_REQUIRED');
        }

        const response = await fetch('/api/payments/verify-pin', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': authHeader
            },
            body: JSON.stringify({ pin })
        });

        if (response.status === 401 || response.status === 403) {
            location.replace('/login');
            throw new Error('LOGIN_REQUIRED');
        }

        const contentType = response.headers.get('content-type') || '';
        const body = contentType.includes('application/json') ? await response.json() : null;
        if (!response.ok) {
            throw new Error(body?.message || 'PIN_VERIFY_FAILED');
        }

        return body?.verified === true;
    }

    function buildPaymentRequest(draft) {
        return {
            categoryId: draft.categoryId,
            pickup: {
                address: draft.pickup.address,
                lat: draft.pickup.lat,
                lng: draft.pickup.lng
            },
            dropoff: {
                address: draft.dropoff.address,
                lat: draft.dropoff.lat,
                lng: draft.dropoff.lng
            },
            weight: draft.weight,
            itemSize: draft.itemSize,
            deliveryInstructionType: draft.pickupGuide?.deliveryInstructionType,
            entranceCode: draft.pickupGuide?.entranceCode,
            unitDetail: draft.pickupGuide?.unitDetail,
            deliveryNote: draft.pickupGuide?.deliveryNote,
            deliveryReferencePhotoUrl: draft.pickupGuide?.photoUrl
        };
    }

    async function payDelivery() {
        const draft = loadDraft();
        const idempotencyKey = crypto.randomUUID ? crypto.randomUUID() : `payment-${Date.now()}`;
        const authHeader = getAuthHeader();
        if (!authHeader) {
            location.replace('/login');
            throw new Error('LOGIN_REQUIRED');
        }

        const response = await fetch('/api/v1/delivery-requests/pay', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Idempotency-Key': idempotencyKey,
                'Authorization': authHeader
            },
            body: JSON.stringify(buildPaymentRequest(draft))
        });

        if (response.status === 401 || response.status === 403) {
            location.replace('/login');
            throw new Error('LOGIN_REQUIRED');
        }

        if (!response.ok) {
            throw new Error('PAYMENT_REQUEST_FAILED');
        }

        return await response.json();
    }

    async function submitPin() {
        if (pinValue.length !== 6) {
            return;
        }

        let verified = false;
        try {
            verified = await verifyPin(pinValue);
        } catch (error) {
            pinValue = '';
            renderDots();
            if (error.message !== 'LOGIN_REQUIRED') {
                setHelper(
                    error.message === 'PIN_VERIFY_FAILED'
                        ? 'PIN 검증 중 오류가 발생했습니다. 다시 시도해 주세요.'
                        : error.message,
                    'error'
                );
            }
            return;
        }

        if (!verified) {
            pinValue = '';
            renderDots();
            setHelper('PIN이 올바르지 않습니다.', 'error');
            return;
        }

        setHelper('PIN 확인이 완료되었습니다. 결제를 처리하는 중입니다...', 'ok');

        let result;
        try {
            result = await payDelivery();
        } catch (error) {
            if (error.message !== 'LOGIN_REQUIRED') {
                setHelper('결제 요청 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.', 'error');
            }
            return;
        }

        const draft = loadDraft();
        draft.paymentResult = result;
        draft.paymentStatus = 'COMPLETED';
        if (draft.pickupGuide) {
            draft.pickupGuide.entranceCode = '';
        }
        saveDraft(draft);
        location.href = '/payment-complete';
    }

    (function init() {
        let draft = loadDraft();
        if (draft.paymentStatus === 'COMPLETED') {
            // Only redirect to payment-complete if the current draft has a completed result matching the current flow.
            // If the user started a new order flow or modified the draft, reset stale payment status.
            if (draft.paymentResult && draft.paymentResult.deliveryRequestId && draft.paymentEstimate) {
                location.replace('/payment-complete');
                return;
            } else {
                draft = resetPaymentState(draft);
            }
        }
        if (!draft.paymentEstimate) {
            location.replace('/payment-confirmation');
            return;
        }

        document.getElementById('totalFee').textContent = formatPoint(draft.paymentEstimate.totalFee);
        document.getElementById('keypad').addEventListener('click', onKeypadClick);
        renderDots();
    })();
</script>
</body>
</html>
