<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카테고리 선택 - Shinhan Delivery</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <script src="/js/utils/storage.js"></script>
    <style>
        :root {
            --primary: var(--color-blue-500);
            --text-dark: var(--color-black-200);
            --text-muted: #4A5568;
            --surface: #F8F8F8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family-base);
        }

        body {
            min-height: 100vh;
            color: var(--text-dark);
            background: #fff;
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        header.top {
            display: flex;
            align-items: center;
            padding: 8px 20px;
        }

        .back-button {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 999px;
            border: 0;
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        header.top h1 {
            flex: 1;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            margin-right: 32px;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 32px;
            padding: 8px 20px 24px;
            flex: 1;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 10px;
        }

        .search-bar svg {
            width: 18px;
            height: 18px;
            min-width: 18px;
            color: #94A3B8;
        }

        .search-bar input {
            flex: 1;
            border: 0;
            background: transparent;
            font-family: var(--font-family-base);
            font-size: 14px;
            color: var(--text-dark);
        }

        .search-bar input::placeholder {
            color: #94A3B8;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 16px 8px 12px;
            background: var(--surface);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            font-family: var(--font-family-base);
        }

        .category-card.selected {
            background: #fff;
            border-color: var(--primary);
        }

        .category-card .icon-box {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .category-card.selected .icon-box {
            background: #EFF6FF;
        }

        .category-card .icon-box img {
            width: 20px;
            height: 20px;
        }

        .category-card .category-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.3;
        }

        .category-card.selected .category-name {
            color: var(--primary);
            font-weight: 700;
        }

        .grid-empty {
            grid-column: 1 / -1;
            padding: 40px 0;
            text-align: center;
            font-size: 14px;
            color: #94A3B8;
        }

        footer.bottom {
            padding: 16px 20px 24px;
        }

        footer.bottom button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-family: var(--font-family-base);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        footer.bottom button:disabled {
            background: #CBD5E1;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<main class="page">
    <header class="top">
        <button class="back-button" type="button" aria-label="뒤로 가기" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1>카테고리 선택</h1>
    </header>

    <div class="content">
        <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input type="text" id="searchInput" placeholder="카테고리를 검색하세요">
        </div>

        <div class="categories-grid" id="categoriesGrid">
            <div th:if="${categories == null or #lists.isEmpty(categories)}" class="grid-empty">검색 결과가 없어요.</div>
            <button th:each="cat : ${categories}" type="button" class="category-card" th:attr="data-id=${cat.id},data-name=${cat.name}">
                <div class="icon-box">
                    <img th:src="@{'/images/icons/package.svg'}" th:alt="${cat.name}">
                </div>
                <span class="category-name" th:text="${cat.name}">카테고리명</span>
            </button>
        </div>
    </div>

    <footer class="bottom">
        <button type="button" id="confirmButton" disabled onclick="confirmCategory()">선택 완료</button>
    </footer>
</main>

<script>
    const CATEGORY_ICONS = {
        '전자기기/가전': 'smartphone.svg',
        '식품/음료': 'coffee.svg',
        '의류/패션잡화': 'shirt.svg',
        '서류/문서': 'file-text.svg',
        '생활용품/잡화': 'package.svg',
        '가구/인테리어': 'home.svg',
        '화장품/뷰티': 'sparkles.svg',
        '도서/음반': 'book-open.svg',
        '스포츠/레저': 'activity.svg',
        '반려동물 용품': 'heart.svg',
        '꽃/식물': 'leaf.svg',
        '기타': 'more-horizontal.svg'
    };
    const DEFAULT_ICON = CATEGORY_ICONS['기타'];

    function authHeader() {
        const token = localStorage.getItem('accessToken');
        const tokenType = localStorage.getItem('tokenType') || 'Bearer';
        if (!token) return null;
        return `${tokenType} ${token}`;
    }

    let categories = [];
    let selectedCategory = null;

    function renderGrid(filterText) {
        const grid = document.getElementById('categoriesGrid');
        const filtered = filterText
            ? categories.filter((c) => c.name.includes(filterText))
            : categories;

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="grid-empty">검색 결과가 없어요.</div>';
            return;
        }

        grid.innerHTML = '';
        filtered.forEach((category) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'category-card' + (selectedCategory && selectedCategory.id === category.id ? ' selected' : '');

            const iconBox = document.createElement('span');
            iconBox.className = 'icon-box';
            const icon = document.createElement('span');
            icon.className = 'icon-mask';
            const iconFile = CATEGORY_ICONS[category.name] || DEFAULT_ICON;
            icon.style.maskImage = `url(/images/category-icons/${iconFile})`;
            icon.style.webkitMaskImage = `url(/images/category-icons/${iconFile})`;
            iconBox.appendChild(icon);

            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = category.name;

            card.appendChild(iconBox);
            card.appendChild(name);
            card.addEventListener('click', () => {
                selectedCategory = category;
                document.getElementById('confirmButton').disabled = false;
                renderGrid(document.getElementById('searchInput').value.trim());
            });
            grid.appendChild(card);
        });
    }

    document.getElementById('searchInput').addEventListener('input', (event) => {
        renderGrid(event.target.value.trim());
    });

    function confirmCategory() {
        if (!selectedCategory) return;
        const draft = loadDraft();
        draft.categoryId = selectedCategory.id;
        draft.categoryName = selectedCategory.name;
        saveDraft(draft);
        location.href = '/item-detail';
    }

    async function loadCategories() {
        try {
            const response = await fetch('/api/v1/categories');
            if (!response.ok) throw new Error('failed');
            categories = await response.json();

            const draft = loadDraft();
            if (draft.categoryId) {
                selectedCategory = categories.find((c) => c.id === draft.categoryId) || null;
                document.getElementById('confirmButton').disabled = !selectedCategory;
            }
            renderGrid('');
        } catch (error) {
            document.getElementById('categoriesGrid').innerHTML =
                '<div class="grid-empty">카테고리를 불러오지 못했어요.</div>';
        }
    }

    (function init() {
        if (!authHeader()) {
            location.replace('/login');
            return;
        }
        loadCategories();
    })();
</script>
</body>
</html>
