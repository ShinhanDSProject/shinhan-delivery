<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림 - Shinhan Delivery</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <link rel="stylesheet" th:href="@{/css/pages/notifications.css}">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="/js/utils/auth.js"></script>
    <script src="/js/utils/format.js"></script>
    <script src="/js/notification-badge.js"></script>
    <script th:src="@{/js/pages/notifications.js}"></script>
</head>
<body>
<main class="page">
    <header class="top">
        <button class="back-button" type="button" aria-label="홈으로 이동" onclick="location.href='/home'">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1>알림</h1>
    </header>

    <nav class="tabs" id="tabs">
        <button type="button" class="active" data-tab="ALL">전체</button>
        <button type="button" data-tab="DELIVERY">배송</button>
        <button type="button" data-tab="MATCHING">매칭</button>
        <button type="button" data-tab="POINT">포인트</button>
        <button type="button" data-tab="NOTICE">공지</button>
    </nav>

    <div id="list">
        <article th:each="item : ${notifications}" class="notification-card" th:classappend="${item.read ? 'read' : ''}" th:data-notification-id="${item.id}">
            <div class="meta">
                <span class="category">
                    <span class="dot" th:if="${!item.read}"></span>
                    <span th:text="${item.category}">배송</span>
                </span>
                <span class="time" th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'yyyy.MM.dd') : ''}">2026.08.18</span>
            </div>
            <div class="title" th:text="${item.title}">알림 제목</div>
            <div class="body" th:text="${item.message}">알림 내용</div>
        </article>
        <article th:each="notice : ${notices}" class="notification-card read">
            <div class="meta">
                <span class="category" style="color:var(--cat-notice)">공지</span>
                <span class="time" th:text="${notice.createdAt != null ? #temporals.format(notice.createdAt, 'yyyy.MM.dd') : ''}">2026.08.18</span>
            </div>
            <div class="title" th:text="${notice.title}">공지사항 제목</div>
            <div class="body" th:text="${notice.content}">공지사항 내용</div>
        </article>
    </div>
</main>
</body>
</html>
