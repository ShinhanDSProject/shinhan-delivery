<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림 - Shinhan Delivery</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="/js/notification-badge.js"></script>
    <style>
        :root {
            --primary: var(--color-blue-100);
            --text-dark: var(--color-black-200);
            --text-muted: var(--color-grey-300);
            --surface: var(--color-grey-30);
            --border: var(--color-grey-50);
            --cat-delivery: var(--color-orange-100);
            --cat-matching: var(--color-blue-100);
            --cat-point: var(--color-green-100);
            --cat-notice: var(--color-brown-100);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family-base);
        }

        body {
            min-height: 100vh;
            color: var(--text-dark);
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #FAFBFD;
            padding: 16px 20px 40px;
        }

        header.top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .back-button {
            width: 36px;
            height: 36px;
            border: 0;
            background: transparent;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header.top h1 {
            flex: 1;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin-right: 36px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 16px;
        }

        .tabs button {
            flex: none;
            padding: 8px 16px;
            border-radius: 999px;
            border: 0;
            background: #F4F6FA;
            color: var(--color-grey-300);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .tabs button.active {
            background: var(--color-blue-30);
            color: #fff;
            font-weight: 700;
        }

        .notification-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .notification-card .meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .notification-card .category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
        }

        .notification-card .category .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .notification-card .time {
            font-size: 11px;
            color: var(--color-grey-100);
        }

        .notification-card .title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .notification-card .body {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .notification-card.read .title {
            font-weight: 500;
            color: var(--color-grey-300);
        }

        .empty-state, .loading-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
<main class="page">
    <header class="top">
        <button class="back-button" type="button" aria-label="홈으로 이동" onclick="location.href='/home'">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1>알림</h1>
    </header>

    <nav class="tabs" id="tabs">
        <button type="button" class="active" data-tab="ALL">전체</button>
        <button type="button" data-tab="DELIVERY">배송</button>
        <button type="button" data-tab="MATCHING">매칭</button>
        <button type="button" data-tab="POINT">포인트</button>
        <button type="button" data-tab="NOTICE">공지</button>
    </nav>

    <div id="list"></div>
</main>

<script>
    const CATEGORY_META = {
        DELIVERY: { label: '배송', color: 'var(--cat-delivery)' },
        MATCHING: { label: '매칭', color: 'var(--cat-matching)' },
        POINT: { label: '포인트', color: 'var(--cat-point)' },
        NOTICE: { label: '공지', color: 'var(--cat-notice)' }
    };

    let currentTab = 'ALL';
    let loadInFlight = false;
    let pendingLiveNotifications = [];
    const noticeDetailCache = new Map();

    function authHeader() {
        const token = localStorage.getItem('accessToken');
        const tokenType = localStorage.getItem('tokenType') || 'Bearer';
        if (!token) {
            return null;
        }
        return `${tokenType} ${token}`;
    }

    function formatRelativeTime(isoString) {
        const diffMs = Date.now() - new Date(isoString).getTime();
        const minutes = Math.floor(diffMs / 60000);
        if (minutes < 1) return '방금 전';
        if (minutes < 60) return `${minutes}분 전`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}시간 전`;
        const days = Math.floor(hours / 24);
        return `${days}일 전`;
    }

    async function fetchNotifications(category) {
        const header = authHeader();
        if (!header) {
            return [];
        }
        const query = category ? `?category=${category}&size=30` : '?size=30';
        const response = await fetch(`/api/v1/notifications${query}`, {
            headers: { Authorization: header }
        });
        if (response.status === 401 || response.status === 403) {
            location.replace('/login');
            return [];
        }
        if (!response.ok) {
            return [];
        }
        const page = await response.json();
        return (page.content || []).map((n) => ({
            source: 'notification',
            id: n.id,
            category: n.category,
            title: n.title,
            body: n.message,
            read: n.read,
            createdAt: n.createdAt
        }));
    }

    async function fetchNotices() {
        const response = await fetch('/api/v1/notices?size=30');
        if (!response.ok) {
            return [];
        }
        const page = await response.json();
        return (page.content || []).map((notice) => ({
            source: 'notice',
            id: notice.id,
            category: 'NOTICE',
            title: notice.title,
            body: null,
            read: true,
            createdAt: notice.createdAt
        }));
    }

    function renderCard(item) {
        const card = document.createElement('article');
        card.className = `notification-card ${item.read ? 'read' : ''}`;
        if (item.source === 'notification') {
            card.dataset.notificationId = item.id;
        }
        const meta = CATEGORY_META[item.category] || { label: item.category, color: 'var(--text-muted)' };
        card.innerHTML = `
            <div class="meta">
                <span class="category" style="color:${meta.color}">
                    ${item.read ? '' : '<span class="dot"></span>'}${meta.label}
                </span>
                <span class="time">${formatRelativeTime(item.createdAt)}</span>
            </div>
            <div class="title">${item.title}</div>
            <div class="body">${item.body || ''}</div>
        `;

        if (item.source === 'notification') {
            card.addEventListener('click', () => markNotificationRead(item.id, card));
        } else {
            card.addEventListener('click', () => toggleNoticeDetail(item.id, card));
        }
        return card;
    }

    async function markNotificationRead(id, card) {
        if (card.classList.contains('read')) {
            return;
        }
        const header = authHeader();
        const response = await fetch(`/api/v1/notifications/${id}/read`, {
            method: 'PATCH',
            headers: { Authorization: header }
        });
        if (response.ok) {
            card.classList.add('read');
            const dot = card.querySelector('.dot');
            if (dot) dot.remove();
        }
    }

    async function toggleNoticeDetail(id, card) {
        const bodyEl = card.querySelector('.body');
        if (bodyEl.textContent.trim()) {
            bodyEl.textContent = '';
            return;
        }
        if (noticeDetailCache.has(id)) {
            bodyEl.textContent = noticeDetailCache.get(id);
            return;
        }
        const response = await fetch(`/api/v1/notices/${id}`);
        if (!response.ok) {
            return;
        }
        const detail = await response.json();
        noticeDetailCache.set(id, detail.content);
        bodyEl.textContent = detail.content;
    }

    async function loadTab(tab) {
        loadInFlight = true;
        const list = document.getElementById('list');
        list.innerHTML = '<div class="loading-state">불러오는 중...</div>';

        let items = [];
        if (tab === 'ALL') {
            const [notifications, notices] = await Promise.all([fetchNotifications(null), fetchNotices()]);
            items = [...notifications, ...notices];
        } else if (tab === 'NOTICE') {
            items = await fetchNotices();
        } else {
            items = await fetchNotifications(tab);
        }

        items.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        list.innerHTML = '';
        if (items.length === 0) {
            list.innerHTML = '<div class="empty-state">표시할 알림이 없어요.</div>';
        } else {
            items.forEach((item) => list.appendChild(renderCard(item)));
        }

        loadInFlight = false;
        flushPendingLiveNotifications();
    }

    /**
     * REST 목록 로딩(loadTab)이 진행 중일 때 도착한 실시간 알림은 곧바로 그리지 않고 여기 쌓아둔다 — loadTab이
     * 끝나면서 list.innerHTML을 비우면 그 사이 그려둔 카드가 같이 사라지기 때문이다. 로딩이 끝난 뒤 한 번에 반영한다.
     */
    function flushPendingLiveNotifications() {
        const toRender = pendingLiveNotifications;
        pendingLiveNotifications = [];
        toRender.forEach((notification) => insertLiveNotification(notification));
    }

    /** id 기준으로 이미 렌더링된 카드가 있으면(REST 응답과 겹치는 경우) 건너뛰고, 없으면 목록 맨 위에 추가한다. */
    function insertLiveNotification(notification) {
        const list = document.getElementById('list');
        if (list.querySelector(`[data-notification-id="${notification.id}"]`)) {
            return;
        }
        const item = {
            source: 'notification',
            id: notification.id,
            category: notification.category,
            title: notification.title,
            body: notification.message,
            read: notification.read,
            createdAt: notification.createdAt
        };
        list.querySelector('.empty-state')?.remove();
        list.prepend(renderCard(item));
    }

    document.getElementById('tabs').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-tab]');
        if (!button) return;
        document.querySelectorAll('#tabs button').forEach((b) => b.classList.remove('active'));
        button.classList.add('active');
        currentTab = button.dataset.tab;
        loadTab(currentTab);
    });

    if (!authHeader()) {
        location.replace('/login');
    } else {
        loadTab(currentTab);
        subscribeToNotifications((notification) => {
            if (currentTab !== 'ALL' && currentTab !== 'DELIVERY') {
                return;
            }
            if (loadInFlight) {
                pendingLiveNotifications.push(notification);
                return;
            }
            insertLiveNotification(notification);
        });
    }
</script>
</body>
</html>
