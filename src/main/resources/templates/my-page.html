<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - Shinhan Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/my-page.css">
</head>
<body class="mypage-body">
<main class="mobile-shell">
  <header class="page-header">
    <div th:replace="~{fragments/components :: safeBackButton('/home')}"></div>
    <h1 class="page-title">My Page</h1>
    <span aria-hidden="true"></span>
  </header>

  <section class="profile-card" aria-label="내 프로필">
    <div class="avatar" aria-hidden="true"></div>
    <div>
      <p id="memberName" class="profile-card__name" th:text="${member != null ? member.name : '사용자 이름'}">사용자 이름</p>
      <p id="memberRole" class="profile-card__role" th:text="${member != null ? (member.role == 'COURIER' ? '배달원 회원' : '일반 고객 회원') : '회원 유형'}">회원 유형</p>
    </div>
  </section>

  <nav class="menu-card" aria-label="마이페이지 메뉴">
    <a class="menu-link" href="/profile-edit">
      <span>프로필 수정</span><span class="menu-chevron" aria-hidden="true">›</span>
    </a>
    <a class="menu-link" href="/change-password">
      <span>비밀번호 변경</span><span class="menu-chevron" aria-hidden="true">›</span>
    </a>
    <a class="menu-link" href="/payment-pin-settings">
      <span>결제 PIN 설정</span><span class="menu-chevron" aria-hidden="true">›</span>
    </a>
    <a class="menu-link" href="/address-management">
      <span>배송 주소 관리</span><span class="menu-chevron" aria-hidden="true">›</span>
    </a>
    <a class="menu-link" href="/delivery-history">
      <span>배송 내역</span><span class="menu-chevron" aria-hidden="true">›</span>
    </a>
    <a class="menu-link" href="/point-wallet">
      <span>포인트 지갑</span><span class="menu-chevron" aria-hidden="true">›</span>
    </a>
    <a class="menu-link" href="/delivery-cancel-list">
      <span>배송 취소 내역</span><span class="menu-chevron" aria-hidden="true">›</span>
    </a>
    <a class="menu-link" href="/announcements">
      <span>공지사항</span><span class="menu-chevron" aria-hidden="true">›</span>
    </a>
  </nav>

  <button id="logoutButton" class="logout-button" type="button">로그아웃</button>
  <p class="app-version">앱 버전 v1.0.0</p>

  <nav th:replace="~{fragments/components :: customerBottomNavigation('myPage')}"></nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>

<script src="/js/my-page-api.js"></script>
<script src="/js/safe-back-navigation.js"></script>
<script>
  const nameElement = document.getElementById("memberName");
  const roleElement = document.getElementById("memberRole");

  async function loadProfile() {
    try {
      const profile = await MyPageApi.request("/api/v1/members/me");
      nameElement.textContent = `${profile.name} 님`;
      roleElement.textContent = MyPageApi.roleLabel(profile.role);
      nameElement.classList.remove("skeleton");
      roleElement.classList.remove("skeleton");
    } catch (error) {
      if (MyPageApi.requireToken()) {
        nameElement.textContent = "프로필을 불러오지 못했습니다";
        roleElement.textContent = "";
        nameElement.classList.remove("skeleton");
        roleElement.classList.remove("skeleton");
        MyPageApi.showToast(error.message);
      }
    }
  }

  document.getElementById("logoutButton").addEventListener("click", MyPageApi.logout);
  document.querySelectorAll(".preparing-menu").forEach((button) => {
    button.addEventListener("click", () => MyPageApi.showToast("준비 중인 기능입니다."));
  });

  if (MyPageApi.requireToken()) loadProfile();
</script>
</body>
</html>
