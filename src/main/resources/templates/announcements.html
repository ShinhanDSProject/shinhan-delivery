<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 - Shinhan Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/my-page.css">
</head>
<body class="mypage-body">
<main class="mobile-shell">
  <header class="page-header">
    <a class="icon-button"
       th:href="${selectedNotice != null and category != null} ? @{/announcements(category=${category})} : (${selectedNotice != null} ? @{/announcements} : @{/my-page})"
       aria-label="뒤로 가기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <h1 class="page-title">공지사항</h1>
    <span aria-hidden="true"></span>
  </header>

  <section th:if="${selectedNotice == null}" class="content-view" aria-label="공지사항 목록">
    <div class="notice-list" aria-live="polite">
      <div th:if="${notices == null or #lists.isEmpty(notices)}" class="empty-state">등록된 공지사항이 없습니다.</div>
      <a th:each="notice : ${notices}"
         class="notice-card"
         th:href="${category != null} ? @{/announcements(id=${notice.id},category=${category})} : @{/announcements(id=${notice.id})}"
         th:attr="aria-label=|${notice.title} 공지사항 상세 보기|">
        <span>
          <span class="notice-card__title">
            <span th:if="${notice.isPinned}" class="notice-pin" aria-label="상단 고정"></span>
            <span th:text="${notice.title}">공지사항 제목</span>
          </span>
          <span class="notice-card__date" th:text="${notice.createdAt != null ? #temporals.format(notice.createdAt, 'yyyy.MM.dd') : ''}">2026.08.10</span>
        </span>
        <span class="menu-chevron" aria-hidden="true">›</span>
      </a>
    </div>
  </section>

  <article th:if="${selectedNotice != null}" class="notice-detail-view is-open" aria-live="polite">
    <h2 class="notice-detail__title" th:text="${selectedNotice.title}">공지사항 제목</h2>
    <p class="notice-detail__meta">
      <span th:text="${selectedNotice.createdAt != null ? #temporals.format(selectedNotice.createdAt, 'yyyy.MM.dd') : ''}">2026.08.10</span>
      <span aria-hidden="true"> · </span>
      <span th:replace="~{fragments/components :: badge(${selectedNotice.category}, 'primary')}">카테고리</span>
    </p>
    <p class="notice-detail__content" th:text="${selectedNotice.content}">공지사항 내용</p>
  </article>

  <nav class="bottom-nav" aria-label="하단 내비게이션">
    <a class="bottom-nav__item" href="/my-page" aria-label="포인트"><span class="brand-p">P</span></a>
    <a class="bottom-nav__item" href="/home" aria-label="홈">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5v-9Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 21v-7h6v7" stroke="currentColor" stroke-width="1.7"/></svg>
    </a>
    <a class="bottom-nav__item is-active" href="/my-page" aria-label="마이페이지">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </a>
  </nav>
</main>
</body>
</html>
