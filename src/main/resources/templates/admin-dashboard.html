<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드 - Shinhan Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --border-color: #334155;
      --accent: var(--color-blue-100);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .admin-navbar {
      height: 64px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-badge {
      font-size: 11px;
      font-weight: 600;
      background: rgba(37, 99, 235, 0.2);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--accent);
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #94A3B8;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      color: white;
      border-color: white;
    }

    .admin-layout {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .page-sub {
      color: #94A3B8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .table-card {
      background-color: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    .admin-table th {
      background-color: #0F172A;
      color: #94A3B8;
      font-weight: 600;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .admin-table td {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      color: #E2E8F0;
      vertical-align: middle;
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-pending {
      background: #FEF3C7;
      color: #D97706;
    }

    .doc-link {
      color: var(--accent);
      text-decoration: underline;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .btn-approve {
      background-color: #16A34A;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-reject {
      background-color: #DC2626;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-msg {
      padding: 48px;
      text-align: center;
      color: #94A3B8;
    }

    /* 토스트 알림 */
    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1E293B;
      color: white;
      border: 1px solid var(--accent);
      padding: 12px 20px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <nav class="admin-navbar">
    <div class="nav-brand">
      <span>Shinhan Delivery</span>
      <span class="admin-badge">ADMIN PORTAL</span>
    </div>
    <div class="nav-user">
      <span id="adminName">관리자 님</span>
      <button class="btn-logout" onclick="logoutAdmin()">로그아웃</button>
    </div>
  </nav>

  <main class="admin-layout">
    <h1 class="page-title">🚴 배송원 자격 심사 관리</h1>
    <p class="page-sub">신규 배송원의 제출 증빙 서류를 검토하고 자격을 승인 또는 거절 처리합니다.</p>

    <div class="table-card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>이름</th>
            <th>이메일 / 연락처</th>
            <th>활동 지역</th>
            <th>증빙 서류</th>
            <th>상태</th>
            <th>심사 처리</th>
          </tr>
        </thead>
        <tbody id="pendingCourierList">
          <tr>
            <td colspan="7" class="empty-msg">목록을 불러오는 중입니다...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="toast" class="toast-popup"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadPendingCouriers();
    });

    async function loadPendingCouriers() {
      const token = localStorage.getItem('accessToken');
      if (!token) {
        window.location.href = '/admin-login';
        return;
      }

      try {
        const res = await fetch('/api/v1/admin/couriers/pending', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401 || res.status === 403) {
          showToast('⚠️ 관리자 권한이 만료되었거나 접근할 수 없습니다.');
          setTimeout(() => { window.location.href = '/admin-login'; }, 1200);
          return;
        }

        const data = await res.json();
        const couriers = data.content || [];
        const tbody = document.getElementById('pendingCourierList');

        tbody.textContent = '';
        if (couriers.length === 0) {
          const emptyTr = document.createElement('tr');
          const emptyTd = document.createElement('td');
          emptyTd.colSpan = 7;
          emptyTd.className = 'empty-msg';
          emptyTd.textContent = '🎉 현재 승인 대기 중인 배송원이 없습니다.';
          emptyTr.appendChild(emptyTd);
          tbody.appendChild(emptyTr);
          return;
        }

        couriers.forEach(c => {
          const tr = document.createElement('tr');

          const tdId = document.createElement('td');
          tdId.textContent = c.id;
          tr.appendChild(tdId);

          const tdName = document.createElement('td');
          const strongName = document.createElement('strong');
          strongName.textContent = c.name;
          tdName.appendChild(strongName);
          tr.appendChild(tdName);

          const tdContact = document.createElement('td');
          tdContact.appendChild(document.createTextNode(c.email || ''));
          tdContact.appendChild(document.createElement('br'));
          const phoneSpan = document.createElement('span');
          phoneSpan.style.fontSize = '12px';
          phoneSpan.style.color = '#94A3B8';
          phoneSpan.textContent = c.phoneNumber || '-';
          tdContact.appendChild(phoneSpan);
          tr.appendChild(tdContact);

          const tdRegion = document.createElement('td');
          tdRegion.textContent = c.activityRegion || '전국';
          tr.appendChild(tdRegion);

          const tdDoc = document.createElement('td');
          if (c.proofDocumentUrl) {
            const docLink = document.createElement('a');
            docLink.href = c.proofDocumentUrl;
            docLink.target = '_blank';
            docLink.rel = 'noopener noreferrer';
            docLink.className = 'doc-link';
            docLink.textContent = '📄 서류 확인';
            tdDoc.appendChild(docLink);
          } else {
            const noDocSpan = document.createElement('span');
            noDocSpan.style.color = '#94A3B8';
            noDocSpan.textContent = '미제출';
            tdDoc.appendChild(noDocSpan);
          }
          tr.appendChild(tdDoc);

          const tdStatus = document.createElement('td');
          const statusSpan = document.createElement('span');
          statusSpan.className = 'status-pill status-pending';
          statusSpan.textContent = c.courierApprovalStatus || 'PENDING';
          tdStatus.appendChild(statusSpan);
          tr.appendChild(tdStatus);

          const tdActions = document.createElement('td');
          const actionDiv = document.createElement('div');
          actionDiv.className = 'action-btns';

          const btnApprove = document.createElement('button');
          btnApprove.className = 'btn-approve';
          btnApprove.textContent = '승인';
          btnApprove.addEventListener('click', () => approveCourier(c.id, c.name));

          const btnReject = document.createElement('button');
          btnReject.className = 'btn-reject';
          btnReject.textContent = '거절';
          btnReject.addEventListener('click', () => rejectCourier(c.id, c.name));

          actionDiv.appendChild(btnApprove);
          actionDiv.appendChild(btnReject);
          tdActions.appendChild(actionDiv);
          tr.appendChild(tdActions);

          tbody.appendChild(tr);
        });
      } catch (err) {
        showToast('❌ 대기 목록을 불러오지 못했습니다.');
      }
    }

    async function approveCourier(id, name) {
      if (!confirm(`'${name}' 기사의 배송원 자격을 승인하시겠습니까?`)) return;
      await processApproval(`/api/v1/admin/couriers/${id}/approve`, 'PATCH', `'${name}' 기사님이 승인되었습니다!`);
    }

    async function rejectCourier(id, name) {
      if (!confirm(`'${name}' 기사의 배송원 자격을 거절하시겠습니까?`)) return;
      await processApproval(`/api/v1/admin/couriers/${id}/reject`, 'PATCH', `'${name}' 기사 자격이 거절되었습니다.`);
    }

    async function processApproval(url, method, successMsg) {
      const token = localStorage.getItem('accessToken');
      try {
        const res = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        if (res.ok) {
          showToast(`🎉 ${successMsg}`);
          loadPendingCouriers();
        } else {
          const err = await res.json();
          showToast(`❌ 처리 실패: ${err.message || '오류 발생'}`);
        }
      } catch (err) {
        showToast('❌ 서버 통신 오류가 발생했습니다.');
      }
    }

    function logoutAdmin() {
      localStorage.removeItem('accessToken');
      document.cookie = "accessToken=; path=/; max-age=0;";
      window.location.href = '/admin-login';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }
  </script>
</body>
</html>
