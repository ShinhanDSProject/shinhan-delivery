<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>픽업하러 가는 길 - Shinhan Delivery</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <script src="/js/utils/geo.js"></script>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bc0d2e17087637bd52851cb9a43d19df&libraries=services&autoload=false"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        :root {
            --primary: var(--color-blue-30);
            --text-dark: var(--color-black-200);
            --text-muted: var(--color-grey-300);
            --border: var(--color-grey-50);
            --accent-soft: var(--color-blue-50);
            --surface: #FAFBFD;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family-base);
        }

        html, body {
            height: 100%;
        }

        body {
            color: var(--text-dark);
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header.top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
        }

        .back-button {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 999px;
            border: 0;
            background: rgba(0, 0, 0, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        header.top .title-group h1 {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
        }

        header.top .title-group p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .map-area {
            flex: 1;
            min-height: 200px;
            background: var(--border);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .bottom-sheet {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            background: var(--color-white-100);
            border-top: 1px solid var(--border);
            box-shadow: 0 -10px 24px rgba(0, 0, 0, 0.06);
            border-radius: 24px 24px 0 0;
            overflow-y: auto;
        }

        .pickup-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pickup-card .label {
            font-size: 12px;
            font-weight: 600;
            color: #94A3B8;
        }

        .pickup-card .address {
            font-size: 16px;
            font-weight: 800;
        }

        .info-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background: var(--border);
            border-radius: 8px;
            font-size: 13px;
        }

        .info-box .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .info-box .row .k {
            color: var(--text-muted);
            white-space: nowrap;
        }

        .info-box .row .v {
            font-weight: 700;
            text-align: right;
        }

        .photo-section label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .photo-upload {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 24px 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
        }

        .photo-upload svg {
            width: 24px;
            height: 24px;
            color: #4A5568;
        }

        .photo-upload span {
            font-size: 13px;
            font-weight: 600;
            color: #4A5568;
        }

        .photo-preview {
            display: none;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .photo-preview.visible {
            display: block;
        }

        .photo-preview img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .photo-preview button {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 0;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            cursor: pointer;
        }

        .warning-note {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-red-100);
        }

        .pickup-button {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 12px;
            background: var(--primary);
            color: var(--color-white-100);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .pickup-button:disabled {
            background: var(--color-grey-100);
            cursor: not-allowed;
        }

        .load-error {
            padding: 24px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .toast-popup {
            display: none;
            position: fixed;
            left: 50%;
            bottom: 100px;
            transform: translateX(-50%);
            background: var(--color-black-200);
            color: var(--color-white-100);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 13px;
            z-index: 20;
            white-space: nowrap;
        }

        .toast-popup.toast-error {
            background: var(--color-red-100);
        }
    </style>
</head>
<body>
<main class="page">
    <header class="top">
        <button class="back-button" type="button" aria-label="홈으로 이동" onclick="location.href='/courier-home'">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="title-group">
            <h1 id="legTitle">픽업하러 가는 길</h1>
            <p id="etaNote">예상시간 확인 중...</p>
        </div>
    </header>

    <div class="map-area">
        <div id="map"></div>
    </div>

    <div class="bottom-sheet" id="bottomSheet">
        <div class="status-message">불러오는 중...</div>
    </div>
</main>

<div class="toast-popup" id="toast"></div>

<script>
    // 배송원 평균 이동 속도(km/h) 가정치. realtime-tracking.html과 동일한 추정 방식을 사용한다.
    const ASSUMED_SPEED_KMH = 25;
    const ITEM_SIZE_LABELS = { SMALL: '소형', MEDIUM: '중형', LARGE: '대형' };
    const INSTRUCTION_LABELS = {
        LEAVE_AT_DOOR_NO_BELL: '문 앞에 두고 벨 누르지 않기',
        ENTRANCE_CODE: '공동현관 출입번호 사용',
        SECURITY_OFFICE: '경비실에 맡기기',
        CUSTOM: '기타 전달 요청'
    };

    const deliveryId = new URLSearchParams(location.search).get('id');
    let map;
    let courierMarker;
    let destinationMarker;
    let pickup;
    let dropoff;
    let uploadedPickupPhotoUrl = null;
    let photoSelectionVersion = 0;

    // 배송원의 이동 좌표를 주기적으로 서버에 발행해, 고객의 realtime-tracking.html 지도 마커가 실시간으로 움직이게 한다.
    // 시속 30km 기준 5초면 약 42m씩 튀어 보여서 3초(약 25m)로 좁힘 — 그 아래로는 GPS 노이즈(5~15m)와
    // 실제 이동거리가 비슷해져 저속 이동(자전거/킥보드) 시 오히려 흔들려 보일 수 있어 3초 정도가 적당한 절충점.
    const LOCATION_PUBLISH_INTERVAL_MS = 3000;
    let locationClient = null;
    let locationWatchId = null;
    let latestPosition = null;
    let locationPublishTimer = null;
    let locationPermissionWarningShown = false;

    function authHeader() {
        const token = localStorage.getItem('accessToken');
        const tokenType = localStorage.getItem('tokenType') || 'Bearer';
        if (!token) return null;
        return `${tokenType} ${token}`;
    }

    // LocalDateTime은 타임존 정보가 없는 "그 자리 시각"이라, UTC 기준인 toISOString()을 그대로 잘라 보내면
    // 실제 로컬 시각과 시차만큼(KST 기준 9시간) 어긋난 값이 저장된다. 로컬 벽시계 시각을 직접 조립해서 보낸다.
    function toLocalIsoString(date) {
        const pad = (n, len = 2) => String(n).padStart(len, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}` +
            `T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}.${pad(date.getMilliseconds(), 3)}`;
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast-popup ${isError ? 'toast-error' : ''}`;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    function updateEta(courierLat, courierLng, target) {
        const km = haversineKm(courierLat, courierLng, target.lat, target.lng);
        const minutes = Math.max(1, Math.round((km / ASSUMED_SPEED_KMH) * 60));
        document.getElementById('etaNote').textContent = `예상시간 ${minutes}분`;
    }

    // 처음 호출되면 지도를 새로 만들고, 이미 만들어져 있으면(픽업완료 후 배송 구간으로 전환) 마커/중심만 옮긴다.
    function ensureMap(courierLat, courierLng, target) {
        const courierPos = new kakao.maps.LatLng(courierLat, courierLng);
        if (!map) {
            const container = document.getElementById('map');
            map = new kakao.maps.Map(container, { center: courierPos, level: 5 });
            courierMarker = new kakao.maps.Marker({ position: courierPos, map });
            destinationMarker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(target.lat, target.lng), map });
        } else {
            courierMarker.setPosition(courierPos);
            destinationMarker.setPosition(new kakao.maps.LatLng(target.lat, target.lng));
            map.setCenter(courierPos);
        }
        updateEta(courierLat, courierLng, target);
    }

    function locateAndShowMap(target) {
        kakao.maps.load(() => {
            if (!navigator.geolocation) {
                ensureMap(target.lat, target.lng, target);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => ensureMap(position.coords.latitude, position.coords.longitude, target),
                () => ensureMap(target.lat, target.lng, target)
            );
        });
    }

    // offer-subscription.js의 연결 패턴(JWT 인증 헤더, 재연결)을 재사용한다.
    function startLocationPublishing() {
        if (!navigator.geolocation) {
            showToast('이 기기에서는 위치 공유를 사용할 수 없어요.', true);
            return;
        }
        const header = authHeader();
        if (!header) return;

        locationWatchId = navigator.geolocation.watchPosition(
            (position) => { latestPosition = position; },
            () => {
                if (locationPermissionWarningShown) return;
                locationPermissionWarningShown = true;
                showToast('위치 접근 권한이 없어 실시간 위치 공유가 꺼져 있어요.', true);
            },
            { enableHighAccuracy: true }
        );

        const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
        locationClient = new StompJs.Client({
            brokerURL: `${protocol}://${location.host}/ws`,
            connectHeaders: { Authorization: header },
            reconnectDelay: 4000
        });
        locationClient.activate();

        locationPublishTimer = setInterval(() => {
            if (!latestPosition || !locationClient.connected) return;
            locationClient.publish({
                destination: `/app/delivery/${deliveryId}/location`,
                body: JSON.stringify({
                    deliveryId: Number(deliveryId),
                    latitude: latestPosition.coords.latitude,
                    longitude: latestPosition.coords.longitude,
                    timestamp: toLocalIsoString(new Date())
                })
            });
        }, LOCATION_PUBLISH_INTERVAL_MS);
    }

    function stopLocationPublishing() {
        if (locationWatchId !== null) {
            navigator.geolocation.clearWatch(locationWatchId);
            locationWatchId = null;
        }
        if (locationPublishTimer) {
            clearInterval(locationPublishTimer);
            locationPublishTimer = null;
        }
        if (locationClient) {
            locationClient.deactivate();
            locationClient = null;
        }
    }

    window.addEventListener('pagehide', stopLocationPublishing);

    function createRow(label, value) {
        const row = document.createElement('div');
        row.className = 'row';
        const k = document.createElement('span');
        k.className = 'k';
        k.textContent = label;
        const v = document.createElement('span');
        v.className = 'v';
        v.textContent = value;
        row.appendChild(k);
        row.appendChild(v);
        return row;
    }

    // entranceCode/unitDetail/deliveryNote는 고객이 자유 입력한 텍스트라 innerHTML 문자열 조립 대신
    // DOM API + textContent로만 채워 스크립트 삽입(XSS)을 막는다.
    function appendInstructionRows(container, detail) {
        if (!detail.deliveryInstructionType || detail.deliveryInstructionType === 'NONE') {
            return;
        }
        const box = document.createElement('div');
        box.className = 'info-box';
        box.appendChild(
            createRow('전달 방식', INSTRUCTION_LABELS[detail.deliveryInstructionType] || detail.deliveryInstructionType)
        );
        if (detail.entranceCode) box.appendChild(createRow('출입번호', detail.entranceCode));
        if (detail.unitDetail) box.appendChild(createRow('동/호수', detail.unitDetail));
        if (detail.deliveryNote) box.appendChild(createRow('요청 사항', detail.deliveryNote));
        container.appendChild(box);
    }

    function renderSheet(detail) {
        document.getElementById('legTitle').textContent =
            detail.status === 'PICKED_UP' ? '배송하러 가는 길' : '픽업하러 가는 길';
        const sheet = document.getElementById('bottomSheet');
        if (detail.status === 'PICKED_UP') {
            renderDropoffLeg(sheet, detail);
        } else {
            renderPickupLeg(sheet, detail);
        }
    }

    function renderPickupLeg(sheet, detail) {
        sheet.innerHTML = `
            <div class="pickup-card">
                <span class="label">픽업지</span>
                <span class="address" data-field="pickupAddress"></span>
            </div>
            <div class="info-box">
                <div class="row"><span class="k">물품 정보</span><span class="v">${ITEM_SIZE_LABELS[detail.itemSize] || detail.itemSize} · ${Number(detail.weight).toFixed(1)}kg</span></div>
            </div>
            <div class="photo-section">
                <label>물품 확인 사진</label>
                <button type="button" class="photo-upload" id="photoUploadBtn">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M4 7h3l2-3h6l2 3h3v13H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                    <span id="photoUploadLabel">사진 찍어 추가하기</span>
                </button>
                <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" hidden>
                <div class="photo-preview" id="photoPreview">
                    <img id="photoPreviewImg" alt="물품 확인 사진 미리보기">
                    <button type="button" id="photoRemoveBtn" aria-label="사진 삭제">×</button>
                </div>
            </div>
            <div class="warning-note">⚠ 수락 후 무단 취소 시 서비스 이용 정지(노쇼 패널티)가 부과될 수 있습니다.</div>
            <button class="pickup-button" id="pickupButton" type="button" disabled>픽업 완료</button>
        `;
        sheet.querySelector('[data-field="pickupAddress"]').textContent = detail.pickupAddress;

        document.getElementById('photoUploadBtn').addEventListener('click', () => {
            document.getElementById('photoInput').click();
        });
        document.getElementById('photoInput').addEventListener('change', onPickupPhotoSelected);
        document.getElementById('photoRemoveBtn').addEventListener('click', removePickupPhoto);
        document.getElementById('pickupButton').addEventListener('click', () => confirmPickup(detail.id));
    }

    function renderDropoffLeg(sheet, detail) {
        sheet.innerHTML = `
            <div class="pickup-card">
                <span class="label">배송지</span>
                <span class="address" data-field="dropoffAddress"></span>
            </div>
            <div id="instructionSlot"></div>
            <div class="warning-note">⚠ 수락 후 무단 취소 시 서비스 이용 정지(노쇼 패널티)가 부과될 수 있습니다.</div>
            <button class="pickup-button" id="pickupButton" type="button">배송 완료 처리하기</button>
        `;
        sheet.querySelector('[data-field="dropoffAddress"]').textContent = detail.dropoffAddress;
        appendInstructionRows(sheet.querySelector('#instructionSlot'), detail);
        document.getElementById('pickupButton').addEventListener('click', () => goToCompletePhoto(detail.id));
    }

    async function onPickupPhotoSelected(event) {
        const file = event.target.files[0];
        if (!file) return;
        const selectionVersion = ++photoSelectionVersion;

        const label = document.getElementById('photoUploadLabel');
        label.textContent = '업로드 중...';
        try {
            const formData = new FormData();
            formData.append('file', file);
            const response = await fetch('/api/v1/uploads/image', {
                method: 'POST',
                headers: { Authorization: authHeader() },
                body: formData
            });
            if (!response.ok) throw new Error('upload failed');
            const result = await response.json();
            if (selectionVersion !== photoSelectionVersion) return;   // 그 사이 다른 사진이 선택/삭제됨 — 이 응답은 버림
            uploadedPickupPhotoUrl = result.imageUrl;

            document.getElementById('photoPreviewImg').src = uploadedPickupPhotoUrl;
            document.getElementById('photoPreview').classList.add('visible');
            document.getElementById('photoUploadBtn').style.display = 'none';
            document.getElementById('pickupButton').disabled = false;
        } catch (error) {
            if (selectionVersion === photoSelectionVersion) {
                event.target.value = '';   // 같은 파일을 다시 선택해도 change가 발생하도록 초기화(재시도 가능하게)
                label.textContent = '업로드에 실패했어요. 다시 시도해주세요';
            }
        }
    }

    function removePickupPhoto() {
        photoSelectionVersion++;
        uploadedPickupPhotoUrl = null;
        document.getElementById('photoInput').value = '';
        document.getElementById('photoPreview').classList.remove('visible');
        document.getElementById('photoUploadBtn').style.display = 'flex';
        document.getElementById('photoUploadLabel').textContent = '사진 찍어 추가하기';
        document.getElementById('pickupButton').disabled = true;
    }

    function goToCompletePhoto(id) {
        location.href = `/delivery-complete-photo?id=${id}`;
    }

    async function confirmPickup(id) {
        if (!uploadedPickupPhotoUrl) return;
        const button = document.getElementById('pickupButton');
        button.disabled = true;
        try {
            const res = await fetch(`/api/v1/delivery-requests/${id}/pickup`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', Authorization: authHeader() },
                body: JSON.stringify({ pickupPhotoUrl: uploadedPickupPhotoUrl })
            });
            if (res.ok) {
                showToast('🎉 픽업 완료 처리되었습니다. 배송지로 이동해주세요.');
                const detail = await fetchDeliveryDetail(id);
                if (detail) {
                    renderSheet(detail);
                    locateAndShowMap(dropoff);
                }
                return;
            }
            const errData = await res.json().catch(() => ({}));
            showToast(`❌ ${errData.message || '처리에 실패했습니다.'}`, true);
            button.disabled = false;
        } catch (error) {
            showToast('❌ 네트워크 오류가 발생했습니다.', true);
            button.disabled = false;
        }
    }

    async function fetchDeliveryDetail(id) {
        const header = authHeader();
        const response = await fetch(`/api/v1/delivery-requests/${id}`, {
            headers: { Authorization: header },
            cache: 'no-store'
        });
        if (response.status === 401) {
            location.replace('/courier-login');
            return null;
        }
        if (!response.ok) {
            throw new Error('배송 정보를 불러오지 못했어요.');
        }
        return response.json();
    }

    async function load() {
        const detail = await fetchDeliveryDetail(deliveryId);
        if (!detail) return;
        if (detail.status !== 'MATCHED' && detail.status !== 'PICKED_UP') {
            throw new Error('이미 종료되었거나 진행할 수 없는 배송 요청이에요.');
        }

        pickup = { lat: detail.pickupLatitude, lng: detail.pickupLongitude };
        dropoff = { lat: detail.dropoffLatitude, lng: detail.dropoffLongitude };
        renderSheet(detail);
        locateAndShowMap(detail.status === 'PICKED_UP' ? dropoff : pickup);
        startLocationPublishing();
    }

    (function init() {
        if (!authHeader()) {
            location.replace('/courier-login');
            return;
        }
        if (!deliveryId) {
            location.replace('/courier-home');
            return;
        }
        load().catch((error) => {
            document.getElementById('bottomSheet').innerHTML =
                `<div class="load-error">${error.message}</div>`;
        });
    })();
</script>
</body>
</html>
