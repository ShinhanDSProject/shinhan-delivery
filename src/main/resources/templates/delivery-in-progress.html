<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>픽업하러 가는 길 - Shinhan Delivery</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <script src="/js/utils/geo.js"></script>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bc0d2e17087637bd52851cb9a43d19df&libraries=services&autoload=false"></script>
    <style>
        :root {
            --primary: var(--color-blue-30);
            --text-dark: var(--color-black-200);
            --text-muted: var(--color-grey-300);
            --border: var(--color-grey-50);
            --accent-soft: var(--color-blue-50);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family-base);
        }

        html, body {
            height: 100%;
        }

        body {
            color: var(--text-dark);
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header.top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
        }

        .back-button {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 999px;
            border: 0;
            background: rgba(0, 0, 0, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        header.top .title-group h1 {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
        }

        header.top .title-group p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .map-area {
            flex: 1;
            min-height: 200px;
            background: var(--border);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .bottom-sheet {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            background: var(--color-white-100);
            border-top: 1px solid var(--border);
            box-shadow: 0 -10px 24px rgba(0, 0, 0, 0.06);
            border-radius: 24px 24px 0 0;
            overflow-y: auto;
        }

        .pickup-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pickup-card .label {
            font-size: 12px;
            font-weight: 600;
            color: #94A3B8;
        }

        .pickup-card .address {
            font-size: 16px;
            font-weight: 800;
        }

        .info-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background: var(--border);
            border-radius: 8px;
            font-size: 13px;
        }

        .info-box .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .info-box .row .k {
            color: var(--text-muted);
            white-space: nowrap;
        }

        .info-box .row .v {
            font-weight: 700;
            text-align: right;
        }

        .warning-note {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-red-100);
        }

        .pickup-button {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 12px;
            background: var(--primary);
            color: var(--color-white-100);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .pickup-button:disabled {
            background: var(--color-grey-100);
            cursor: not-allowed;
        }

        .load-error {
            padding: 24px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .toast-popup {
            display: none;
            position: fixed;
            left: 50%;
            bottom: 100px;
            transform: translateX(-50%);
            background: var(--color-black-200);
            color: var(--color-white-100);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 13px;
            z-index: 20;
            white-space: nowrap;
        }

        .toast-popup.toast-error {
            background: var(--color-red-100);
        }
    </style>
</head>
<body>
<main class="page">
    <header class="top">
        <button class="back-button" type="button" aria-label="홈으로 이동" onclick="location.href='/courier-home'">
            <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="title-group">
            <h1>픽업하러 가는 길</h1>
            <p id="etaNote">예상시간 확인 중...</p>
        </div>
    </header>

    <div class="map-area">
        <div id="map"></div>
    </div>

    <div class="bottom-sheet" id="bottomSheet">
        <div class="status-message">불러오는 중...</div>
    </div>
</main>

<div class="toast-popup" id="toast"></div>

<script>
    // 배송원 평균 이동 속도(km/h) 가정치. realtime-tracking.html과 동일한 추정 방식을 사용한다.
    const ASSUMED_SPEED_KMH = 25;
    const ITEM_SIZE_LABELS = { SMALL: '소형', MEDIUM: '중형', LARGE: '대형' };
    const INSTRUCTION_LABELS = {
        LEAVE_AT_DOOR_NO_BELL: '문 앞에 두고 벨 누르지 않기',
        ENTRANCE_CODE: '공동현관 출입번호 사용',
        SECURITY_OFFICE: '경비실에 맡기기',
        CUSTOM: '기타 전달 요청'
    };

    const deliveryId = new URLSearchParams(location.search).get('id');
    let map;
    let courierMarker;
    let pickup;

    function authHeader() {
        const token = localStorage.getItem('accessToken');
        const tokenType = localStorage.getItem('tokenType') || 'Bearer';
        if (!token) return null;
        return `${tokenType} ${token}`;
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast-popup ${isError ? 'toast-error' : ''}`;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    function updateEta(courierLat, courierLng) {
        const km = haversineKm(courierLat, courierLng, pickup.lat, pickup.lng);
        const minutes = Math.max(1, Math.round((km / ASSUMED_SPEED_KMH) * 60));
        document.getElementById('etaNote').textContent = `예상시간 ${minutes}분`;
    }

    function initMap(courierLat, courierLng) {
        const container = document.getElementById('map');
        map = new kakao.maps.Map(container, {
            center: new kakao.maps.LatLng(courierLat, courierLng),
            level: 5
        });

        courierMarker = new kakao.maps.Marker({
            position: new kakao.maps.LatLng(courierLat, courierLng),
            map
        });

        new kakao.maps.Marker({
            position: new kakao.maps.LatLng(pickup.lat, pickup.lng),
            map
        });

        updateEta(courierLat, courierLng);
    }

    function renderInstruction(detail) {
        if (!detail.deliveryInstructionType || detail.deliveryInstructionType === 'NONE') {
            return '';
        }
        const rows = [`<div class="row"><span class="k">전달 방식</span><span class="v">${INSTRUCTION_LABELS[detail.deliveryInstructionType] || detail.deliveryInstructionType}</span></div>`];
        if (detail.entranceCode) {
            rows.push(`<div class="row"><span class="k">출입번호</span><span class="v">${detail.entranceCode}</span></div>`);
        }
        if (detail.unitDetail) {
            rows.push(`<div class="row"><span class="k">동/호수</span><span class="v">${detail.unitDetail}</span></div>`);
        }
        if (detail.deliveryNote) {
            rows.push(`<div class="row"><span class="k">요청 사항</span><span class="v">${detail.deliveryNote}</span></div>`);
        }
        return `<div class="info-box">${rows.join('')}</div>`;
    }
    // entranceCode/unitDetail/deliveryNote는 고객이 자유 입력한 텍스트이므로, 이 화면 안에서만 쓰는
    // 문자열 템플릿에 꽂을 때 이스케이프하지 않으면 XSS 위험이 있어 renderSheet에서 textContent로 재설정한다.

    function renderSheet(detail) {
        const sheet = document.getElementById('bottomSheet');
        const alreadyPickedUp = detail.status === 'PICKED_UP';
        sheet.innerHTML = `
            <div class="pickup-card">
                <span class="label">픽업지</span>
                <span class="address" data-field="pickupAddress"></span>
            </div>
            <div class="info-box">
                <div class="row"><span class="k">물품 정보</span><span class="v">${ITEM_SIZE_LABELS[detail.itemSize] || detail.itemSize} · ${Number(detail.weight).toFixed(1)}kg</span></div>
            </div>
            ${renderInstruction(detail)}
            <div class="warning-note">⚠ 수락 후 무단 취소 시 서비스 이용 정지(노쇼 패널티)가 부과될 수 있습니다.</div>
            <button class="pickup-button" id="pickupButton" type="button" ${alreadyPickedUp ? 'disabled' : ''}>
                ${alreadyPickedUp ? '픽업 완료됨' : '픽업 완료'}
            </button>
        `;
        sheet.querySelector('[data-field="pickupAddress"]').textContent = detail.pickupAddress;

        if (!alreadyPickedUp) {
            document.getElementById('pickupButton').addEventListener('click', () => confirmPickup(detail.id));
        }
    }

    async function confirmPickup(id) {
        const button = document.getElementById('pickupButton');
        button.disabled = true;
        try {
            const res = await fetch(`/api/v1/delivery-requests/${id}/pickup`, {
                method: 'PATCH',
                headers: { Authorization: authHeader() }
            });
            if (res.ok) {
                showToast('🎉 픽업 완료 처리되었습니다. 목적지로 이동해주세요.');
                button.textContent = '픽업 완료됨';
                return;
            }
            const errData = await res.json().catch(() => ({}));
            showToast(`❌ ${errData.message || '처리에 실패했습니다.'}`, true);
            button.disabled = false;
        } catch (error) {
            showToast('❌ 네트워크 오류가 발생했습니다.', true);
            button.disabled = false;
        }
    }

    async function load() {
        const header = authHeader();
        const response = await fetch(`/api/v1/delivery-requests/${deliveryId}`, {
            headers: { Authorization: header },
            cache: 'no-store'
        });
        if (response.status === 401) {
            location.replace('/courier-login');
            return;
        }
        if (!response.ok) {
            throw new Error('배송 정보를 불러오지 못했어요.');
        }
        const detail = await response.json();
        if (detail.status !== 'MATCHED' && detail.status !== 'PICKED_UP') {
            throw new Error('이미 종료되었거나 진행할 수 없는 배송 요청이에요.');
        }

        pickup = { lat: detail.pickupLatitude, lng: detail.pickupLongitude };
        renderSheet(detail);

        kakao.maps.load(() => {
            if (!navigator.geolocation) {
                initMap(pickup.lat, pickup.lng);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => initMap(position.coords.latitude, position.coords.longitude),
                () => initMap(pickup.lat, pickup.lng)
            );
        });
    }

    (function init() {
        if (!authHeader()) {
            location.replace('/courier-login');
            return;
        }
        if (!deliveryId) {
            location.replace('/courier-home');
            return;
        }
        load().catch((error) => {
            document.getElementById('bottomSheet').innerHTML =
                `<div class="load-error">${error.message}</div>`;
        });
    })();
</script>
</body>
</html>
