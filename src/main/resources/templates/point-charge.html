<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포인트 충전 - Shinhan Delivery</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    :root {
      --charge-line: var(--color-grey-50);
      --charge-muted: var(--color-grey-300);
      --charge-ink: var(--color-black-200);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--charge-ink);
      background:
          radial-gradient(circle at top right, rgba(255, 224, 178, 0.36), transparent 34%),
          linear-gradient(180deg, #fffdf8 0%, #f4f7fb 100%);
      font-family: var(--font-family-base);
    }
    .shell {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 20px 120px;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--charge-line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      cursor: pointer;
    }
    .hero h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .hero p {
      margin: 8px 0 0;
      color: var(--charge-muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .balance-card,
    .panel {
      padding: 22px;
      border: 1px solid var(--charge-line);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.05);
    }
    .balance-card {
      margin-top: 20px;
      background: linear-gradient(155deg, #ffffff 0%, #eef5ff 100%);
    }
    .balance-card .label {
      color: var(--charge-muted);
      font-size: 13px;
      font-weight: 700;
    }
    .balance-card .value {
      margin-top: 10px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .panel { margin-top: 18px; }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .amount-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .amount-chip {
      min-height: 70px;
      padding: 16px;
      border: 1px solid var(--charge-line);
      border-radius: 18px;
      background: #fff;
      color: var(--charge-ink);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .amount-chip strong {
      display: block;
      font-size: 18px;
      font-weight: 800;
    }
    .amount-chip span {
      display: block;
      margin-top: 6px;
      color: var(--charge-muted);
      font-size: 12px;
      font-weight: 700;
    }
    .amount-chip.is-selected {
      border-color: var(--color-blue-100);
      box-shadow: 0 0 0 3px rgba(47, 115, 224, 0.14);
      transform: translateY(-1px);
    }
    .method-list {
      display: grid;
      gap: 10px;
    }
    .method-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 0 16px;
      border: 1px solid var(--charge-line);
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
    }
    .method-item input { accent-color: var(--color-blue-100); }
    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--charge-line);
    }
    .summary strong {
      font-size: 18px;
      font-weight: 800;
    }
    .cta {
      margin-top: 18px;
      width: 100%;
      min-height: 56px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 800;
    }
    .helper {
      margin-top: 12px;
      color: var(--charge-muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      min-width: 200px;
      max-width: calc(100% - 32px);
      padding: 12px 16px;
      border-radius: 999px;
      color: #fff;
      background: rgba(17, 24, 39, 0.88);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      text-align: center;
      font-size: 13px;
      z-index: 20;
    }
    .toast.is-visible { opacity: 1; }
  </style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <button class="icon-btn" type="button" onclick="location.href='/point-wallet'" aria-label="뒤로가기">‹</button>
    <div class="hero">
      <h1>포인트 충전</h1>
      <p>원하는 금액을 선택하고 결제 수단을 골라 포인트를 충전합니다.</p>
    </div>
  </div>

  <section class="balance-card" aria-label="현재 잔액">
    <div class="label">현재 포인트</div>
    <div id="currentBalance" class="value">0 P</div>
  </section>

  <section class="panel" aria-label="충전 금액 선택">
    <h2>충전 금액</h2>
    <div class="amount-grid">
      <button class="amount-chip" type="button" data-amount="5000"><strong>5,000 P</strong><span>가볍게 충전</span></button>
      <button class="amount-chip" type="button" data-amount="10000"><strong>10,000 P</strong><span>가장 많이 선택</span></button>
      <button class="amount-chip" type="button" data-amount="30000"><strong>30,000 P</strong><span>여러 건 결제 준비</span></button>
      <button class="amount-chip" type="button" data-amount="50000"><strong>50,000 P</strong><span>대량 충전</span></button>
    </div>
  </section>

  <section class="panel" aria-label="결제 수단 선택">
    <h2>결제 수단</h2>
    <div class="method-list">
      <label class="method-item"><input type="radio" name="paymentMethod" value="CARD" checked><span>카드 결제</span></label>
      <label class="method-item"><input type="radio" name="paymentMethod" value="BANK_TRANSFER"><span>계좌 이체</span></label>
      <label class="method-item"><input type="radio" name="paymentMethod" value="EASY_PAY"><span>간편 결제</span></label>
    </div>
    <div class="summary">
      <span>충전 후 예상 잔액</span>
      <strong id="nextBalance">0 P</strong>
    </div>
    <button id="chargeButton" class="btn btn-primary cta" type="button" disabled>충전하기</button>
    <div class="helper">충전이 완료되면 포인트 지갑 화면으로 돌아가 최신 잔액을 바로 확인할 수 있습니다.</div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/js/my-page-api.js"></script>
<script>
  const amountButtons = Array.from(document.querySelectorAll(".amount-chip"));
  const chargeButton = document.getElementById("chargeButton");
  const currentBalanceElement = document.getElementById("currentBalance");
  const nextBalanceElement = document.getElementById("nextBalance");
  let selectedAmount = 0;
  let currentBalance = 0;
  let memberId = null;
  let toastTimer = null;

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("is-visible");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2200);
  }

  function formatPoint(amount) {
    return `${Number(amount || 0).toLocaleString()} P`;
  }

  function methodLabel(value) {
    const labels = { CARD: "카드 결제", BANK_TRANSFER: "계좌 이체", EASY_PAY: "간편 결제" };
    return labels[value] || value;
  }

  async function resolveWallet(member) {
    const wallets = await MyPageApi.request("/api/v1/point-wallets");
    const existing = Array.isArray(wallets) ? wallets.find((wallet) => wallet.memberId === member.id) : null;
    if (existing) return existing;
    return MyPageApi.request("/api/v1/point-wallets", {
      method: "POST",
      body: JSON.stringify({ memberId: member.id })
    });
  }

  function syncSummary() {
    nextBalanceElement.textContent = formatPoint(currentBalance + selectedAmount);
    chargeButton.disabled = selectedAmount <= 0;
  }

  amountButtons.forEach((button) => {
    button.addEventListener("click", () => {
      selectedAmount = Number(button.dataset.amount);
      amountButtons.forEach((item) => item.classList.toggle("is-selected", item === button));
      syncSummary();
    });
  });

  async function init() {
    if (!MyPageApi.requireToken()) return;
    try {
      const profile = await MyPageApi.request("/api/v1/members/me");
      memberId = profile.id;
      const wallet = await resolveWallet(profile);
      currentBalance = Number(wallet.balance || 0);
      currentBalanceElement.textContent = formatPoint(currentBalance);
      syncSummary();
    } catch (error) {
      showToast(error.message);
      chargeButton.disabled = true;
    }
  }

  chargeButton.addEventListener("click", async () => {
    if (!memberId || selectedAmount <= 0) {
      showToast("충전 금액을 먼저 선택해 주세요.");
      return;
    }

    const paymentMethod = document.querySelector("input[name='paymentMethod']:checked")?.value || "CARD";
    const idempotencyKey =
      (window.crypto && crypto.randomUUID && crypto.randomUUID()) ||
      `point-charge-${Date.now()}-${Math.random().toString(16).slice(2)}`;

    chargeButton.disabled = true;
    chargeButton.textContent = "충전 처리 중...";

    try {
      const response = await MyPageApi.request("/api/v1/points/charge", {
        method: "POST",
        headers: { "Idempotency-Key": idempotencyKey },
        body: JSON.stringify({ amount: selectedAmount, paymentMethod })
      });

      sessionStorage.setItem("pointChargeSnapshot", JSON.stringify({
        amount: selectedAmount,
        methodLabel: methodLabel(paymentMethod),
        lastChargedAt: response.lastChargedAt
      }));
      location.replace("/point-wallet");
    } catch (error) {
      showToast(error.message);
      chargeButton.disabled = false;
      chargeButton.textContent = "충전하기";
    }
  });

  init();
</script>
</body>
</html>
