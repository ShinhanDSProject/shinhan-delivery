<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배송 주소 관리 - Shinhan Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/my-page.css">
</head>
<body class="mypage-body">
<main class="mobile-shell customer-bottom-nav-content">
  <header class="page-header">
    <button id="backButton" class="icon-button" type="button" aria-label="뒤로 가기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 id="headerTitle" class="page-title">배송 주소 관리</h1>
    <span aria-hidden="true"></span>
  </header>

  <section id="contentView" class="content-view">
    <button id="addButton" class="add-address-button" type="button">＋ 새 주소 추가</button>
    <div id="addressList" class="address-list" aria-live="polite">
      <div th:if="${addresses == null or addresses.empty}" class="empty-state">등록된 배송 주소가 없습니다.<br>새 주소를 추가해보세요.</div>
      <article th:each="item : ${addresses}" class="address-card">
        <div>
          <span class="address-badge" th:text="${item.alias}">우리집</span>
          <p class="address-main" th:text="${item.address}">서울시 강남구</p>
          <p class="address-detail" th:text="${item.detailAddress != null ? item.detailAddress : '상세 주소 없음'}">101동 1001호</p>
        </div>
        <div class="address-actions">
          <button class="address-action" type="button" data-action="edit" th:data-id="${item.id}" th:aria-label="${item.alias + ' 주소 수정'}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 16-.7 4.7L8 20l11-11-4-4L4 16Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m13.5 6.5 4 4" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
          <button class="address-action address-action--delete" type="button" data-action="delete" th:data-id="${item.id}" th:aria-label="${item.alias + ' 주소 삭제'}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3m2 0-1 13H8L7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </article>
    </div>
  </section>

  <section id="formPanel" class="form-panel" aria-labelledby="formTitle">
    <div class="form-panel__header">
      <h2 id="formTitle" class="form-panel__title">새 주소 추가</h2>
      <button id="cancelButton" class="text-button" type="button">취소</button>
    </div>
    <form id="addressForm" novalidate>
      <div class="field-group">
        <label class="field-label" for="alias">주소 별칭</label>
        <input class="field-input" id="alias" name="alias" maxlength="50" placeholder="예: 집, 회사" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="address">기본 주소</label>
        <input class="field-input" id="address" name="address" maxlength="255" placeholder="도로명 주소를 입력해주세요" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="detailAddress">상세 주소</label>
        <input class="field-input" id="detailAddress" name="detailAddress" maxlength="255" placeholder="동, 호수 등 상세 주소">
      </div>
      <div class="field-group">
        <label class="field-label" for="pickupGuide">픽업 가이드</label>
        <textarea class="field-textarea" id="pickupGuide" name="pickupGuide" maxlength="255" placeholder="예: 문 앞에 놓아주세요"></textarea>
      </div>
      <button id="saveButton" class="primary-action" type="submit">저장하기</button>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </form>
  </section>

  <nav th:replace="~{fragments/components :: customerBottomNavigation('myPage')}"></nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>

<script src="/js/utils/format.js"></script>
<script src="/js/my-page-api.js"></script>
<script th:src="@{/js/pages/address-management.js}"></script>
</body>
</html>
