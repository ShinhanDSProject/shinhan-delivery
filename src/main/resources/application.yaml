spring:
  application:
    name: shinhan-delivery

  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  data-seed:
    enabled: ${DATA_SEED_ENABLED:false}
  admin-seed:
    enabled: ${ADMIN_SEED_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:로컬 관리자}
    phone-number: ${ADMIN_PHONE_NUMBER:010-0000-0000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    base-url: /uploads

jwt:
  secret: shinhan-delivery-super-secret-key-for-jwt-authentication-token-security-2026-very-long
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 1209600000 # 14일

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
