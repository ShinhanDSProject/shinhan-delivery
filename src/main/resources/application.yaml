spring:
  application:
    name: shinhan-gaecheokja

  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  data-seed:
    enabled: ${DATA_SEED_ENABLED:false}

jwt:
  secret: shinhan-gaecheokja-super-secret-key-for-jwt-authentication-token-security-2026-very-long
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 1209600000 # 14일
