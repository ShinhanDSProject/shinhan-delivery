spring:
  application:
    name: shinhan-delivery

  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        boot:
          # false로 두면 Hibernate가 기동 시점에 DB 메타데이터를 읽지 않아, DB 없이도 기동된다.
          # DB 없이 기동해야 하는 배포에서만 false로 바꾸며, 이때는
          # SPRING_JPA_DATABASE_PLATFORM 으로 dialect를 직접 지정해야 한다.
          allow_jdbc_metadata_access: ${JPA_JDBC_METADATA_ACCESS:true}

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  # DB 없이 먼저 기동해야 하는 배포에서 SPRING_FLYWAY_ENABLED=false 와 함께 켠다.
  # 기동 이후 백그라운드에서 DB가 준비될 때까지 재시도하며 마이그레이션을 수행한다.
  background-migration:
    enabled: ${BACKGROUND_MIGRATION_ENABLED:false}
    retry-interval-seconds: ${BACKGROUND_MIGRATION_RETRY_INTERVAL_SECONDS:10}
    max-attempts: ${BACKGROUND_MIGRATION_MAX_ATTEMPTS:0}
  data-seed:
    enabled: ${DATA_SEED_ENABLED:false}
  delivery-timeout:
    enabled: ${DELIVERY_TIMEOUT_ENABLED:true}
    timeout-minutes: ${DELIVERY_TIMEOUT_MINUTES:30}
    fixed-delay-ms: ${DELIVERY_TIMEOUT_FIXED_DELAY_MS:60000}
    batch-size: ${DELIVERY_TIMEOUT_BATCH_SIZE:100}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    base-url: /uploads

jwt:
  secret: shinhan-delivery-super-secret-key-for-jwt-authentication-token-security-2026-very-long
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 1209600000 # 14일

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      # DB 장애가 /actuator/health 를 DOWN(503, 응답 30초)으로 만들지 않게 한다.
      # 앱은 DB가 죽어도 살아있고 복구 시 자동 회복되는데, 이 지표 때문에 컨테이너
      # 헬스체크/liveness probe가 앱을 죽은 것으로 판단해 컨테이너를 재시작시킨다.
      enabled: false
