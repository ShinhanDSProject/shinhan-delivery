spring:
  application:
    name: shinhan-delivery

  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    # DB가 아직 기동 중이어도 곧바로 죽지 않고 연결될 때까지 재시도한다.
    # (Flyway가 DataSource를 가장 먼저 잡기 때문에, 이 재시도가 사실상 앱 전체의 DB 대기 역할을 한다)
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}
    connect-retries-interval: ${FLYWAY_CONNECT_RETRIES_INTERVAL:5}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  data-seed:
    enabled: ${DATA_SEED_ENABLED:false}
  delivery-timeout:
    enabled: ${DELIVERY_TIMEOUT_ENABLED:true}
    timeout-minutes: ${DELIVERY_TIMEOUT_MINUTES:30}
    fixed-delay-ms: ${DELIVERY_TIMEOUT_FIXED_DELAY_MS:60000}
    batch-size: ${DELIVERY_TIMEOUT_BATCH_SIZE:100}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    base-url: /uploads

jwt:
  secret: shinhan-delivery-super-secret-key-for-jwt-authentication-token-security-2026-very-long
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 1209600000 # 14일

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      # DB 장애가 /actuator/health 를 DOWN(503, 응답 30초)으로 만들지 않게 한다.
      # 앱은 DB가 죽어도 살아있고 복구 시 자동 회복되는데, 이 지표 때문에 컨테이너
      # 헬스체크/liveness probe가 앱을 죽은 것으로 판단해 컨테이너를 재시작시킨다.
      enabled: false
