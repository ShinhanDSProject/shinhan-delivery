spring:
  application:
    name: shinhan-gaecheokja

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    out-of-order: true
    ignore-migration-patterns: "*:missing"

jwt:
  member:
    secret: ${JWT_MEMBER_SECRET:shinhanswacademyshinhanswacademy}
    access-exp-min: 30
    refresh-exp-min: 1440
