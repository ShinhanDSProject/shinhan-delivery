<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fc" />
    <title>Deliver Happiness</title>
    <link rel="stylesheet" href="/css/design-system.css" />
    <link rel="stylesheet" href="/onboarding/onboarding.css" />
  </head>
  <body>
    <main class="onboarding-shell" aria-label="Deliver Happiness 시작 안내">
      <section class="onboarding-screen splash-screen is-active" data-screen="0" aria-hidden="false">
        <div class="status-bar" aria-hidden="true">
          <span>10:00</span>
          <div class="status-icons">
            <svg viewBox="0 0 20 12" fill="none"><path d="M1 4.5C5.4.6 14.6.6 19 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4.2 7.4C7.4 4.7 12.6 4.7 15.8 7.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8 10.2c1.1-.8 2.9-.8 4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <svg viewBox="0 0 19 12" fill="none"><rect x=".75" y="1.25" width="15.5" height="9.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M17.5 4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="2.8" y="3.3" width="10.6" height="5.4" rx=".8" fill="currentColor"/></svg>
          </div>
        </div>

        <button class="splash-action" type="button" aria-label="시작 안내 보기">
          <div class="parcel-illustration" aria-hidden="true">
            <svg viewBox="0 0 210 180" role="presentation">
              <path d="M37 138.6 109.2 98l62.6 35.4-69.7 39.4c-6.8 3.8-15.1 3.8-21.9 0L37 148.4c-4.8-2.7-4.8-7.1 0-9.8Z" fill="#E5E8ED"/>
              <path d="m55.2 61.2 57.3-32.3L171.3 62l-58.6 33.3-57.5-34.1Z" fill="#EAB16F"/>
              <path d="m55.2 61.2 57.5 34.1v67.1L55.2 129V61.2Z" fill="#BD7B3F"/>
              <path d="m112.7 95.3 58.6-33.3v67.3l-58.6 33.1V95.3Z" fill="#9F6532"/>
              <path d="m94.7 38.9 58.4 33.5-15.4 8.7-58.4-33.4 15.4-8.8Z" fill="#F2C27F"/>
              <path d="m94.7 38.9 15.3-8.7 58.4 33.5-15.3 8.7-58.4-33.5Z" fill="#DB914F"/>
              <path d="m128.1 73.8 15.8-8.9v22.6l-15.8 9V73.8Z" fill="#F3D5A7"/>
              <path d="m128.1 73.8 15.8 8.9v4.8l-15.8 9V73.8Z" fill="#DAB078"/>
              <path d="m68.6 120.2 13.8 8.1v5.5l-13.8-8.1v-5.5Zm17.1 10.1 13.8 8.1v5.5l-13.8-8.1v-5.5Zm17.1 10.1 13.8 8.1v5.5l-13.8-8.1v-5.5Z" fill="#714720"/>
            </svg>
          </div>
          <div class="brand-lockup">
            <span>Deliver</span>
            <strong>Happiness</strong>
          </div>
          <p>간단히 매칭으로 가장 빠르게<br />원하는 곳으로 보내세요.</p>
        </button>
      </section>

      <section class="onboarding-screen walkthrough-screen" data-screen="1" aria-hidden="true">
        <button class="skip-button" type="button">건너뛰기</button>
        <div class="walkthrough-content">
          <div class="feature-art" aria-hidden="true">
            <svg viewBox="0 0 260 180" role="presentation">
              <circle cx="130" cy="90" r="63" fill="#EAF2FF" />
              <path d="M89 59a12 12 0 0 1 12-12h58a12 12 0 0 1 12 12v67a12 12 0 0 1-12 12h-58a12 12 0 0 1-12-12V59Z" fill="#fff" stroke="#D8E0EB" stroke-width="2"/>
              <path d="M112 75h36M112 91h23M112 107h30" stroke="#6D7E98" stroke-width="5" stroke-linecap="round"/>
              <path d="m151 111 9 9 20-24" stroke="#3182F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="70" y="113" width="35" height="25" rx="7" fill="#3182F6"/><path d="M78 122h19" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
          <h1>문앞에서 문앞으로</h1>
          <p>복잡한 접수 과정 없이 우리 집 문앞에 둔 택배를 픽업하여<br />상대방 문앞까지 배송합니다.</p>
        </div>
        <div class="screen-footer">
          <div class="page-dots" aria-label="1 / 3">
            <span class="is-current"></span><span></span><span></span>
          </div>
          <button class="primary-button next-button" type="button">다음으로</button>
        </div>
      </section>

      <section class="onboarding-screen walkthrough-screen" data-screen="2" aria-hidden="true">
        <button class="skip-button" type="button">건너뛰기</button>
        <div class="walkthrough-content">
          <div class="feature-art" aria-hidden="true">
            <svg viewBox="0 0 260 180" role="presentation">
              <circle cx="130" cy="90" r="63" fill="#EAF2FF" />
              <path d="M69 116c21-42 46-42 60-17 12 21 29 19 61-21" stroke="#8AB9FC" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 16"/>
              <path d="M113 63h38l12 24v34h-63V84l13-21Z" fill="#3182F6"/>
              <path d="M119 70h25v17h-25z" fill="#DDEBFF"/><path d="M100 88h63" stroke="#1D5FAF" stroke-width="4"/>
              <circle cx="115" cy="123" r="10" fill="#212936"/><circle cx="150" cy="123" r="10" fill="#212936"/><circle cx="115" cy="123" r="4" fill="#fff"/><circle cx="150" cy="123" r="4" fill="#fff"/>
              <path d="M181 48c0-10 8-18 18-18s18 8 18 18c0 14-18 28-18 28s-18-14-18-28Z" fill="#FF7E67"/><circle cx="199" cy="48" r="6" fill="#fff"/>
            </svg>
          </div>
          <h1>초단기 자동 매칭</h1>
          <p>거리, 무게, 위치 조건에 맞는 배송원이 자동으로 매칭됩니다.<br />빠르고 정확하게!</p>
        </div>
        <div class="screen-footer">
          <div class="page-dots" aria-label="2 / 3">
            <span></span><span class="is-current"></span><span></span>
          </div>
          <button class="primary-button next-button" type="button">다음으로</button>
        </div>
      </section>

      <section class="onboarding-screen walkthrough-screen" data-screen="3" aria-hidden="true">
        <button class="skip-button" type="button">건너뛰기</button>
        <div class="walkthrough-content">
          <div class="feature-art" aria-hidden="true">
            <svg viewBox="0 0 260 180" role="presentation">
              <circle cx="130" cy="90" r="63" fill="#EAF2FF" />
              <rect x="85" y="46" width="90" height="92" rx="16" fill="#fff" stroke="#D8E0EB" stroke-width="2"/>
              <path d="M98 72c19-13 35 11 57-3M99 105c20-17 37 16 61-7" stroke="#B6D4FF" stroke-width="6" stroke-linecap="round"/>
              <path d="M130 72c0-11 9-20 20-20s20 9 20 20c0 15-20 33-20 33s-20-18-20-33Z" fill="#3182F6"/><circle cx="150" cy="72" r="7" fill="#fff"/>
              <circle cx="107" cy="111" r="11" fill="#FF8A70"/><path d="m102 111 4 4 7-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1>실시간 안심 배송</h1>
          <p>배송원의 실시간 위치를 확인하고, 문을 인증 사진으로<br />안심하세요.</p>
        </div>
        <div class="screen-footer">
          <div class="page-dots" aria-label="3 / 3">
            <span></span><span></span><span class="is-current"></span>
          </div>
          <button class="primary-button next-button" type="button">시작하기</button>
        </div>
      </section>

      <section class="onboarding-screen role-screen" data-screen="4" aria-hidden="true">
        <div class="status-bar" aria-hidden="true">
          <span>10:00</span>
          <div class="status-icons">
            <svg viewBox="0 0 20 12" fill="none"><path d="M1 4.5C5.4.6 14.6.6 19 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4.2 7.4C7.4 4.7 12.6 4.7 15.8 7.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8 10.2c1.1-.8 2.9-.8 4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <svg viewBox="0 0 19 12" fill="none"><rect x=".75" y="1.25" width="15.5" height="9.5" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M17.5 4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="2.8" y="3.3" width="10.6" height="5.4" rx=".8" fill="currentColor"/></svg>
          </div>
        </div>
        <div class="role-content">
          <div class="brand-lockup brand-lockup--small">
            <span>Deliver</span>
            <strong>Happiness</strong>
          </div>
          <h1>어떤 방식으로<br />시작할까요?</h1>
          <p>서비스 이용 목적을 선택해주세요.</p>
          <div class="role-options" role="radiogroup" aria-label="이용 방식 선택">
            <button class="role-card" type="button" role="radio" aria-checked="false" data-role="CUSTOMER">
              <span class="role-icon" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none"><rect x="3" y="7" width="22" height="18" rx="5" fill="currentColor"/><path d="M8 8V5.5A2.5 2.5 0 0 1 10.5 3h7A2.5 2.5 0 0 1 20 5.5V8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="10" cy="16" r="2" fill="#fff"/><circle cx="18" cy="16" r="2" fill="#fff"/></svg>
              </span>
              <span><strong>개인 고객</strong><small>배송을 보내고 싶어요</small></span>
              <span class="selection-mark" aria-hidden="true"></span>
            </button>
            <button class="role-card" type="button" role="radio" aria-checked="false" data-role="COURIER">
              <span class="role-icon" aria-hidden="true">
                <svg viewBox="0 0 28 28" fill="none"><path d="M8 4h12l4 18H4L8 4Z" fill="currentColor"/><path d="M10 4 8.5 1.8M18 4l1.5-2.2" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/><circle cx="10" cy="14" r="2" fill="#fff"/><circle cx="18" cy="14" r="2" fill="#fff"/></svg>
              </span>
              <span><strong>배송파트너</strong><small>배송으로 수익을 만들고 싶어요</small></span>
              <span class="selection-mark" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div class="role-footer">
          <p id="role-message" class="role-message" role="status" aria-live="polite"></p>
          <button class="primary-button role-button" type="button" disabled>다음</button>
        </div>
      </section>
    </main>
    <script src="/onboarding/onboarding.js"></script>
  </body>
</html>
