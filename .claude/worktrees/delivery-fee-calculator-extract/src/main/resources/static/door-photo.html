<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문앞 사진 확인 - Shinhan Delivery</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <style>
        :root {
            --primary: var(--color-blue-30);
            --text-dark: var(--color-black-200);
            --text-muted: var(--color-grey-300);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family-base);
        }

        html, body {
            height: 100%;
        }

        body {
            color: var(--color-white-100);
            background: var(--color-black-100);
        }

        .page {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header.top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            z-index: 5;
        }

        .back-button {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 999px;
            border: 0;
            background: rgba(255, 255, 255, 0.12);
            color: var(--color-white-100);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        header.top h1 {
            font-size: 16px;
            font-weight: 700;
        }

        .photo-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 12px 12px;
        }

        #proofPhoto {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            cursor: zoom-in;
            transition: transform 0.2s ease;
            display: none;
        }

        #proofPhoto.zoomed {
            transform: scale(1.8);
            cursor: zoom-out;
        }

        .state-message {
            text-align: center;
            color: rgba(255, 255, 255, 0.72);
            font-size: 14px;
            padding: 0 24px;
        }

        .hint {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.56);
            padding: 12px 20px 20px;
        }
    </style>
</head>
<body>
<main class="page">
    <header class="top">
        <button class="back-button" type="button" aria-label="뒤로가기" onclick="history.back()">←</button>
        <h1>문앞 사진 확인</h1>
    </header>

    <div class="photo-area">
        <img id="proofPhoto" alt="배송 완료 증거 사진">
        <p class="state-message" id="stateMessage">사진을 불러오는 중이에요...</p>
    </div>

    <p class="hint" id="hint" hidden>사진을 눌러 확대/축소할 수 있어요.</p>
</main>

<script>
    function authHeader() {
        const token = localStorage.getItem('accessToken');
        const tokenType = localStorage.getItem('tokenType') || 'Bearer';
        if (!token) return null;
        return `${tokenType} ${token}`;
    }

    async function loadProofPhoto(deliveryId) {
        const response = await fetch(`/api/v1/delivery-requests/${deliveryId}/proof-photo`, {
            headers: { Authorization: authHeader() }
        });
        if (!response.ok) throw new Error('아직 문앞 사진이 등록되지 않았어요.');
        const data = await response.json();

        const img = document.getElementById('proofPhoto');
        img.src = data.proofPhotoUrl;
        img.onload = () => {
            document.getElementById('stateMessage').remove();
            img.style.display = 'block';
            document.getElementById('hint').hidden = false;
        };
        img.onerror = () => {
            document.getElementById('stateMessage').textContent = '사진을 불러오지 못했어요.';
        };
        img.onclick = () => img.classList.toggle('zoomed');
    }

    (function init() {
        if (!authHeader()) {
            location.replace('/login.html');
            return;
        }
        const deliveryId = new URLSearchParams(location.search).get('id');
        if (!deliveryId) {
            location.replace('/home.html');
            return;
        }
        loadProofPhoto(deliveryId).catch((error) => {
            document.getElementById('stateMessage').textContent = error.message;
        });
    })();
</script>
</body>
</html>
