name: Gradle CI

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitmessage'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: shinhan_delivery
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Flyway Migration Filenames
        run: bash scripts/lint-flyway-filenames.sh

      - name: Verify Flyway Migration DDL Rules (Online DDL)
        run: bash scripts/lint-flyway-ddl.sh

      - name: Verify Code Style (Spotless)
        run: ./gradlew spotlessCheck

      - name: Verify JaCoCo Coverage Gate & ArchUnit Architecture Rules
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        env:
          DB_URL: jdbc:mariadb://localhost:3306/shinhan_delivery
          DB_USER: root
          DB_PASSWORD: password
          DB_DRIVER: org.mariadb.jdbc.Driver

      - name: Upload JaCoCo Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/html/

      - name: Run Gradle Build and Package
        run: ./gradlew build -x test
        env:
          DB_URL: jdbc:mariadb://localhost:3306/shinhan_delivery
          DB_USER: root
          DB_PASSWORD: password
          DB_DRIVER: org.mariadb.jdbc.Driver
