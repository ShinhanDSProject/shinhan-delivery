language: ko-KR

reviews:
  path_instructions:
    - path: "**"
      instructions: |
        이 레포지토리의 작업자들은 개발을 처음 접하는 교육생들입니다. 
        단순히 코드의 수정할 점만 기계적으로 나열하기보다는, '왜 해당 코드를 고쳐야 하는지' 구체적인 동작 원리와 베스트 프랙티스를 아주 친절하게 한글로 설명해 주세요. 
        교육생들이 성취감을 느끼고 더 배울 수 있도록 격려하고 따뜻한 톤앤매너로 리뷰 의견을 작성해 주시기 바랍니다.
