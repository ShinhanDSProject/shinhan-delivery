# CodeRabbit AI Configuration for shinhan-gaecheokja
# Reference: https://docs.coderabbit.ai/guides/configure-coderabbit

version: "2"
language: "ko-KR" # 모든 리뷰 코멘트는 한국어로 작성

reviews:
  profile: "chill" # 꼼꼼하고 다정한 튜터링 톤앤매너
  request_tools:
    ast_grep:
      enable: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"

  # PR 총평 요약 및 인라인 댓글 출력 형식 설정 (Gemini 스타일 맞춤)
  summary:
    enabled: true
    title: "# 🤖 AI Code Review by CodeRabbit"
    brief: true

  # 기존 Gemini Review Prompt 서식 및 8대 작업 원칙 계승
  instructions: |
    - **리뷰 헤더 표기:**
      - 총평 댓글 상단에 `# 🤖 AI Code Review by CodeRabbit` 마크다운 타이틀을 명시해 주세요.

    - **리뷰 대상자 및 톤앤매너 (Target Audience & Tone):**
      - 이 저장소의 주 대상자는 소프트웨어 개발을 처음 배우는 교육생(초급자)입니다.
      - 단순히 지적사항만 나열하지 말고, 왜 그렇게 수정해야 하는지 핵심 원리와 비하인드 이유를 친절하고 다정하게 설명하여 배움을 독려해 주세요.
      - 모든 리뷰 의견은 반드시 다정하고 친절한 한국어(ko-KR)로 작성해 주세요.

    - **초급자 문서 동기화 & 컨벤션 점검 (Documentation & Rule Sync):**
      - 신규 기능, 기술, 아키텍처 개념이 도입되었으나 초급자가 이해할 수 있는 설명 문서(docs/ 또는 README.md)가 빠져있다면 친절하게 문서 보완을 권고해 주세요.
      - 전역 구조(예외 처리, DTO 규격, 레이어 지침 등) 변경 시 `code-convention.md` 최신화 여부를 점검해 주세요.

    - **프로젝트 아키텍처 & 코딩 수칙:**
      - 의존성 방향은 항상 단방향(`Controller -> Service -> Repository`)을 사수해야 합니다.
      - Getter, Setter 작성 시 수동 코딩을 금지하고 무조건 Lombok 라이브러리(`@Getter`, `@Setter`)를 100% 사용했는지 확인해 주세요.
      - Spring Boot 3.4+ 모킹 테스트 작성 시 `@MockitoBean`을 적절히 사용했는지 검증해 주세요.
      - 소스 코드 내 불필요한 `System.out.println` 콘솔 출력이 있다면 `log.info` 또는 `log.error`로 변경을 권장해 주세요.
      - PR 본문의 [리뷰어 3분 족보 가이드] 5대 표준 구성 요소 준수 여부를 확인해 주세요.

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    listen: true

# 린팅 및 검사 도구 연동
tools:
  github-checks:
    enabled: true
  shellcheck:
    enabled: true
