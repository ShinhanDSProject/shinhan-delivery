name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gemini AI Code Review
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: 'gemini-flash-latest'
          prompt: 'Please review the pull request code changes and provide your feedback. You must write all your review comments in Korean (모든 리뷰 의견은 반드시 한국어로 작성해 주세요).'
