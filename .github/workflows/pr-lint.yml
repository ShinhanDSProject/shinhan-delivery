name: PR Style & Template Verification Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  verify-pr-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate PR Title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR Title: $PR_TITLE"
          REGEX="^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\([a-z0-9_-]+\))?: .+"
          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "❌ ERROR: PR Title does not follow Conventional Commits format!"
            echo "Expected format: 'type: description' (e.g., 'feat: Add login endpoint')"
            exit 1
          fi
          echo "✅ PR Title format is valid!"

      - name: Validate PR Body Required Sections (3-Minute Walkthrough Guide)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR Body Sections..."
          
          if [[ -z "$PR_BODY" ]]; then
            echo "❌ ERROR: PR Body cannot be empty!"
            exit 1
          fi

          MISSING=0
          
          if [[ "$PR_BODY" != *"1분 퀵 서머리"* && "$PR_BODY" != *"Executive Summary"* ]]; then
            echo "❌ MISSING: '1분 퀵 서머리 (Executive Summary)' section"
            MISSING=1
          fi

          if [[ "$PR_BODY" != *"추천 파일 읽기 순서"* && "$PR_BODY" != *"Recommended Reading Order"* ]]; then
            echo "❌ MISSING: '추천 파일 읽기 순서 (Recommended Reading Order)' section"
            MISSING=1
          fi

          if [[ "$PR_BODY" != *"체크리스트"* && "$PR_BODY" != *"Checklist"* ]]; then
            echo "❌ MISSING: '체크리스트 (Verification Checklist)' section"
            MISSING=1
          fi

          if [ $MISSING -eq 1 ]; then
            echo "❌ ERROR: PR Body must include the Reviewer 3-Minute Walkthrough Guide template!"
            echo "Please refer to docs/pr-review-guide.md or .github/PULL_REQUEST_TEMPLATE.md"
            exit 1
          fi

          echo "✅ PR Body template verification passed!"
