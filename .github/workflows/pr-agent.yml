name: AI PR Agent Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent_review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '/review'))
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: PR Agent Action
        uses: Codium-ai/pr-agent@main
        env:
          GEMINI.KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI.KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.MODEL: "gemini/gemini-1.5-flash"
          PR_REVIEWER.REQUIRE_CANVAS_REVIEW: "false"
          PR_REVIEWER.REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "true"
          PR_REVIEWER.PERSISTENT_COMMENT: "true"
          # 교육생을 위한 친절한 한국어 튜터링 톤 및 규칙 주입
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            - 모든 리뷰 의견 및 요약은 반드시 친절하고 다정한 한국어(ko-KR)로 작성해 주세요.
            - 주요 대상자는 소프트웨어 개발을 처음 배우는 교육생(초급자)입니다.
            - 단순 지적에 그치지 않고, 왜 그렇게 수정해야 하는지 핵심 원리를 다정하게 설명해 주세요.
            - 의존성 방향 단방향(Controller -> Service -> Repository), Lombok @Getter/@Setter 100% 사용, System.out.println 금지를 검증해 주세요.
            - 신규 기능/아키텍처 도입 시 docs/ 또는 code-convention.md 동기화 보완을 권고해 주세요.
