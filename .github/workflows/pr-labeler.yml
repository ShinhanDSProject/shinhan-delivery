name: PR Auto Labeler & Assignee

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize]

jobs:
  pr-labeler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Auto-label PR (Branch & Path)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const branchName = context.payload.pull_request.head.ref;

            // 1. 브랜치명 정규식 패턴 기준 라벨 규칙 정의
            const branchRules = [
              { regex: /^feature\/|^feat\//, label: "feature" },
              { regex: /^fix\/|^bugfix\//, label: "bugfix" },
              { regex: /^doc\/|^docs\//, label: "documentation" },
              { regex: /^refactor\//, label: "refactor" },
              { regex: /^test\//, label: "test" },
              { regex: /^ci\//, label: "ci" }
            ];

            const branchLabels = branchRules
              .filter((rule) => rule.regex.test(branchName))
              .map((rule) => rule.label);

            // 2. Draft(초안) PR 여부에 따른 라벨 처리
            const draftLabels = context.payload.pull_request.draft ? ["DRAFT"] : [];

            // 3. 추출된 대상 라벨 병합 및 중복 제거
            const targetLabels = [...new Set([...branchLabels, ...draftLabels])];

            // 5. 이미 등록되어 있는 기존 라벨 조회
            const { data: existingLabelObjects } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number: pull_number,
            });
            const existingLabels = existingLabelObjects.map((l) => l.name);

            const labelsToAdd = targetLabels.filter((l) => !existingLabels.includes(l));
            const shouldRemoveDraftLabel =
              !context.payload.pull_request.draft && existingLabels.includes("DRAFT");

            if (labelsToAdd.length === 0 && !shouldRemoveDraftLabel) {
              core.info("No label changes required.");
            } else {
              // 6. 없는 라벨 추가 기재 (GitHub API가 자동으로 신규 생성해 줌)
              if (labelsToAdd.length > 0) {
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: pull_number,
                    labels: labelsToAdd,
                  });
                  core.info(`Added labels: ${labelsToAdd.join(", ")}`);
                } catch (error) {
                  core.setFailed(`Failed to add labels: ${error.message}`);
                  return;
                }
              }

              // 7. Draft 상태가 끝나 실전 리뷰 상태가 되면 DRAFT 라벨 자동 회수
              if (shouldRemoveDraftLabel) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pull_number,
                    name: "DRAFT",
                  });
                  core.info("Removed label: DRAFT");
                } catch (error) {
                  core.setFailed(`Failed to remove label DRAFT: ${error.message}`);
                  return;
                }
              }
            }

      - name: Assign PR author
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            // PR 작성자(교육생)를 자동으로 담당자(Assignee)로 지정하여 관리 투명성 증대
            const assignee = context.payload.pull_request.user?.login;
            if (!assignee) {
              core.warning("No PR author found. Skip assigning.");
              return;
            }

            const existingAssignees =
              context.payload.pull_request.assignees?.map((u) => u.login) ?? [];
            if (existingAssignees.includes(assignee)) {
              core.info(`Already assigned to '${assignee}'.`);
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: pull_number,
                assignees: [assignee],
              });
              core.info(`Assigned to '${assignee}'.`);
            } catch (assignError) {
              const status = assignError?.status;
              if (status === 404 || status === 422) {
                core.info(
                  `Skip assigning '${assignee}' (cannot be assigned): ${assignError?.message ?? assignError}`,
                );
              } else {
                core.warning(
                  `Failed to assign '${assignee}': ${assignError?.message ?? assignError}`,
                );
              }
            }
