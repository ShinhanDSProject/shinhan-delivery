plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'net.ltgt.flyway' version '1.0.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'shinhan-gaecheokja'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    
    // Database Migration (Flyway)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    
    // Dotenv support for Spring Boot
    implementation 'me.paulschwarz:spring-dotenv:5.1.0'
    
    // Flyway Gradle Plugin CLI dependencies
    flyway 'org.flywaydb:flyway-core:10.22.0'
    flyway 'org.flywaydb:flyway-mysql:10.22.0'
    flyway 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
    
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// Read environment variables from .env file for Gradle tasks
def env = [:]
def envFile = file(".env")
if (envFile.exists()) {
    envFile.eachLine { line ->
        def trimmed = line.trim()
        if (trimmed && !trimmed.startsWith("#") && trimmed.contains("=")) {
            def parts = trimmed.split("=", 2)
            env[parts[0].trim()] = parts[1].trim()
        }
    }
}

// Configuration for Flyway Plugin CLI tasks
flyway {
    url = env['DB_URL'] ?: 'jdbc:mariadb://localhost:3306/shinhan_gaecheokja'
    user = env['DB_USER'] ?: 'root'
    password = env['DB_PASSWORD'] ?: 'password'
}

tasks.named('test') {
    useJUnitPlatform()
}
