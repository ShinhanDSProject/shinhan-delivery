plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'shinhan-gaecheokja'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    
    // Database Migration (Flyway)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    
    // Dotenv support for Spring Boot
    implementation 'me.paulschwarz:springboot4-dotenv:5.1.0'
    
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// TypeORM의 migration:create처럼 새로운 빈 마이그레이션 SQL 파일을 생성해주는 태스크
tasks.register('migrationCreate') {
    group = 'database'
    description = 'Creates a new empty Flyway migration file sequentially'
    doLast {
        def desc = project.hasProperty('desc') ? project.property('desc') : 'new_migration'
        def migrationDir = file("src/main/resources/db/migration")
        if (!migrationDir.exists()) {
            migrationDir.mkdirs()
        }
        
        // 디렉토리를 스캔하여 다음 버전 번호 계산
        def files = migrationDir.listFiles()
        def nextVersion = 1
        if (files) {
            def versions = files.findAll { it.name.startsWith('V') && it.name.contains('__') }
                                .collect { 
                                    def match = (it.name =~ /^V(\d+)__/)
                                    match ? match[0][1].toInteger() : 0 
                                }
            if (versions) {
                nextVersion = versions.max() + 1
            }
        }
        
        def fileName = "V${nextVersion}__${desc}.sql"
        def newFile = file("src/main/resources/db/migration/${fileName}")
        newFile.text = "-- Migration: V${nextVersion}__${desc}\n"
        println "Created empty migration file: ${newFile.absolutePath}"
    }
}
